unit: s2.m05.u02
python_min: '3.9'
steps:
- id: st01
  type: read
  title: Try options and go back
  body: |
    You need a small list of services to test. Try a choice, then explore what can follow it.
    After that, **undo** the choice. This means you return to the earlier state and try another choice. This method is **backtracking**.
    The list of choices so far is your **path**. You will use a path to build groups, orders, and queen boards.
- id: st02
  type: read
  title: A subset includes or skips each item
  body: |
    A **subset** is a group chosen from a larger group. Each item can be kept or skipped.
    Go through the items in order. For each item, call the function once for each option.
    At the end, save a **snapshot**, or copy, of the path.
    Use path.append(item) to add an item. Use path.pop() to remove and get its last item.

    ```text
                        []
                     /      \
             skip api        keep api
                 []           [api]
                /  \          /     \
              []  [db]    [api]  [api, db]
    ```

    Each first split decides about api. Each last split decides about db. The bottom shows all four subsets.
- id: st03
  type: predict
  title: What does one choice change?
  code: |
    path = ["api"]
    path.append("db")
    print(path.pop(), path)
  choices:
  - text: db ['api', 'db']
    why: pop() also removes the last item from the path.
  - text: db ['api']
    why: The undo returns db and leaves the earlier choice in place.
  - text: api ['db']
    why: Without an index, pop() removes the last item.
  - text: db []
    why: One undo removes one choice, not the whole path.
  answer: 1
- id: st04
  type: predict
  title: What if every saved result shares the path?
  code: |
    result = []
    path = []
    path.append("api")
    result.append(path)
    path.pop()
    result.append(path)
    print(result)
  choices:
  - text: '[[''api''], []]'
    why: Appending path stores the same list, so the later pop is visible in both entries.
  - text: '[[''api''], [''api'']]'
    why: The path is empty after pop().
  - text: '[]'
    why: The pop acts on path. It does not remove entries from result.
  - text: '[[], []]'
    why: The two entries both point at the same list, now empty.
  answer: 3
- id: st05
  type: parsons
  title: Choose, save, then undo
  task: Use all lines. Save a snapshot with api, then restore the empty path.
  lines:
  - path = []
  - saved = []
  - path.append("api")
  - saved.append(path[:])
  - path.pop()
  - print(saved, path)
  expected_stdout: '[[''api'']] []'
  accepted_orders:
  - - 1
    - 0
    - 2
    - 3
    - 4
    - 5
  - - 0
    - 2
    - 1
    - 3
    - 4
    - 5
- id: st06
  type: fix
  title: Save the path as it looks now
  task: Return all subsets of 0 to 8 distinct service names. Each subset keeps input order. The order
    of subsets can vary. Keep services unchanged. For ["api"], return [] and ["api"] inside the result.
    Use recursion.
  starter: |
    def service_groups(services):
        result = []
        path = []

        def visit(index):
            if index == len(services):
                result.append(path)
                return
            visit(index + 1)
            path.append(services[index])
            visit(index + 1)
            path.pop()

        visit(0)
        return result
  solution: |
    def service_groups(services):
        result = []
        path = []

        def visit(index):
            if index == len(services):
                result.append(path[:])
                return
            visit(index + 1)
            path.append(services[index])
            visit(index + 1)
            path.pop()

        visit(0)
        return result
  tests: |
    assert service_groups([]) == [[]]
    assert sorted(service_groups(["api"])) == [[], ["api"]]
    services = ["api", "db"]
    assert sorted(service_groups(services)) == [[], ["api"], ["api", "db"], ["db"]]
    assert services == ["api", "db"]
  hint_levels:
  - See what happens to an old result after path.pop().
  - Save a new list at each completed path.
  - Use result.append(path[:]) inside the base case.
  explanation: The copy keeps the path as it was when that branch ended. Building all subsets takes
    O(n·2ⁿ) time and output space for n ≥ 1. Stack and current path use O(n) extra space.
- id: st07
  type: code
  title: List possible service groups
  exercise: exercises/practice.py
  function: service_groups
  test_class: ServiceGroups
  hint_levels:
  - Use the next item index to decide whether to keep or skip it.
  - Explore skipping, then append the item and explore keeping. Undo the append.
  - At index == len(services), save path[:] and return.
- id: st08
  type: try
  title: Grow the set of choices
  starter: |
    def routes(slots):
        if slots == 0:
            return 1
        skip = routes(slots - 1)
        keep = routes(slots - 1)
        return skip + keep

    print(routes(2))
  task: Call routes(3). It counts the paths when each slot can be kept or skipped.
  check:
    stdout_line: '8'
- id: st09
  type: read
  title: A permutation chooses an order
  body: |
    A **permutation** puts every input item in an order. With three jobs, any of the three may go first.
    The second job must be one of the two unused jobs. The final job is the last unused one.
    There are 3 × 2 × 1 orders. We call this 3 **factorial**, written 3!.

    Use a list of **flags** to track jobs in the path. A flag marks whether a job is used. Make one False flag per job with [False] * len(jobs).
    Set a flag when you add a job. Clear it after you return and remove the job from the path.
- id: st10
  type: predict
  title: Which job is still allowed?
  code: |
    jobs = ["api", "db", "cache"]
    used = [False, True, True]
    choices = []
    for index in range(len(jobs)):
        if not used[index]:
            choices.append(jobs[index])
    print(choices)
  choices:
  - text: '[''api'']'
    why: Only the flag for api is False, so it is the only unused job.
  - text: '[''db'', ''cache'']'
    why: True marks jobs already on the path.
  - text: '[''api'', ''db'', ''cache'']'
    why: The loop checks all jobs but includes only ones with a False flag.
  - text: '[]'
    why: The used jobs do not block every choice. The api flag is False.
  answer: 0
- id: st11
  type: code
  title: Try all run orders for a job batch
  exercise: exercises/practice.py
  function: job_orders
  test_class: JobOrders
  hint_levels:
  - Look for a job you have yet to put on the path.
  - Mark the job as used, append it, then explore. Undo both changes afterward.
  - When len(path) == len(jobs), append path[:] to result and return.
- id: st12
  type: read
  title: Place one queen per row
  body: |
    Two queens cannot share a row, a column, or a **diagonal**, a line that runs at an angle.
    Such a clash is a **conflict**. Place one queen in each row, so rows never clash.

    For a queen at row r and column c, use r - c and r + c as diagonal labels.
    Moving down and right keeps r - c the same. Moving down and left keeps r + c the same.
    Use three sets to store used columns and the two kinds of diagonal labels.
    A set holds each value once. Use set() for an empty set. Use add() and remove() to change it.
- id: st13
  type: predict
  title: Will the next branch see the old set?
  code: |
    used = set()
    used.add(1)
    print(1 in used)
    used.remove(1)
    print(1 in used)
  choices:
  - text: 'True

      True'
    why: remove() changes the set so it no longer contains 1.
  - text: 'False

      True'
    why: The first print runs after the add. The second runs after the remove.
  - text: 'True

      False'
    why: The choice adds 1 to used. Undoing the choice removes it.
  - text: 'False

      False'
    why: The add makes the first check true.
  answer: 2
- id: st14
  type: predict
  title: Which squares share a diagonal?
  code: |
    row, col = 1, 3
    next_row, next_col = 2, 2
    print(row - col == next_row - next_col, row + col == next_row + next_col)
  choices:
  - text: True False
    why: Moving down and left changes the difference and keeps the sum.
  - text: False True
    why: The differences are -2 and 0. Both sums are 4.
  - text: True True
    why: Two different squares cannot share both labels.
  - text: False False
    why: Different rows and columns can still share a diagonal.
  answer: 1
- id: st15
  type: read
  title: Prune as soon as a choice fails
  body: |
    **Pruning** means skipping a choice that cannot lead to a full answer.
    Before adding a queen, check its column and both diagonal labels. If any is used, skip that square.
    A **candidate** is a choice you can test for the next row.

    If a square is free, add all three labels to their sets. Then visit the next row.
    After that call returns, remove the same three labels. Now the next candidate sees the original board.
    When row equals n on an n by n board, you have one full layout.
- id: st16
  type: predict
  title: How many choices survive in the next row?
  code: |
    columns = {1}
    down = {-1}
    up = {1}
    row = 1
    choices = []
    for col in range(4):
        if col not in columns and row - col not in down and row + col not in up:
            choices.append(col)
    print(choices)
  choices:
  - text: '[3]'
    why: Column 1 is used. Columns 0 and 2 share a diagonal with the queen at (0, 1).
  - text: '[0, 2, 3]'
    why: That filters by column only. The two diagonals also rule out squares.
  - text: '[2, 3]'
    why: Column 2 has row - col equal to -1, which is used.
  - text: '[]'
    why: Column 3 keeps all three labels distinct from the first queen’s labels.
  answer: 0
- id: st17
  type: code
  title: Count layouts on a small queen board
  exercise: exercises/practice.py
  function: count_boards
  test_class: CountBoards
  hint_levels:
  - Work on one row in each call. Think about what makes a column safe.
  - Check the column, row - col, and row + col. Only recurse if all three labels are free.
  - Add the three labels, add place(row + 1) to your count, then remove the same labels.
- id: st18
  type: fix
  title: 'Challenge: clear the choice that the next branch needs'
  task: Fix the recursive job orders for up to 7 distinct strings. Keep jobs unchanged. Return all orders
    in any sequence, including one empty order for []. For ["api", "db"], give both orders.
  starter: |
    def job_orders(jobs):
        used = [False] * len(jobs)
        path = []
        result = []

        def visit():
            if len(path) == len(jobs):
                result.append(path[:])
                return
            for index in range(len(jobs)):
                if not used[index]:
                    used[index] = True
                    path.append(jobs[index])
                    visit()
                    path.pop()

        visit()
        return result
  solution: |
    def job_orders(jobs):
        used = [False] * len(jobs)
        path = []
        result = []

        def visit():
            if len(path) == len(jobs):
                result.append(path[:])
                return
            for index in range(len(jobs)):
                if not used[index]:
                    used[index] = True
                    path.append(jobs[index])
                    visit()
                    path.pop()
                    used[index] = False

        visit()
        return result
  tests: |
    assert sorted(job_orders(["api", "db"])) == [["api", "db"], ["db", "api"]]
    assert job_orders([]) == [[]]
    jobs = ["a", "b", "c"]
    assert len({tuple(order) for order in job_orders(jobs)}) == 6
    assert jobs == ["a", "b", "c"]
  hint_levels: &id001
  - Follow what happens when the first full path returns.
  - Undoing the append still leaves one other record of the choice.
  - After path.pop(), set used[index] = False.
  explanation: Every sibling branch must see the flags as they were before the choice. Time and output
    space are O(n·n!) for n ≥ 1. Working space is O(n).
- id: st19
  type: terminal
  title: 'Hands-on: run and change a small script'
  guide: handson.md
  check: The script prints the expected output and you can explain the changed run.
- id: st20
  type: explain
  title: Explain your plan to a teammate
  prompt: Write 2–4 English sentences. How do diagonal labels help you skip queen choices? What must
    you undo after a call? Then compare with the model in the lesson summary.
  rubric:
  - Say how to detect a diagonal conflict.
  - Explain what restoring state lets the next branch do.
  model_answer: Squares on the same diagonal have the same row minus column or the same row plus column.
    I skip a square if a queen already uses one of its labels. When I return, I remove the column and
    both labels so the next choice starts from the same board.
