- id: st16
  type: read
  title: Keep two counts instead of repeating calls
  body: |
    For stairs, the number of routes to the next step is the sum of
    the two counts before it. Reuse those counts instead of solving
    the same smaller problems again.

    ```text
    step number:   0   1   2   3   4
    route count:   1   1   2   3   5
    ```

    The counts at 0 and 1 are both 1. To move one step, shift the pair
    (older, newer) to (newer, older + newer).
    In a double assignment, Python computes both right sides first.
- id: st17
  type: predict
  title: Move the pair once
  code: |
    older, newer = 2, 3
    older, newer = newer, older + newer
    print(older, newer)
  choices:
  - text: 5 3
    why: The sum becomes the second value, not the first.
  - text: 3 5
    why: Both new values use the old pair. The next pair holds 3 and 5.
  - text: 3 6
    why: The right side uses the old older value, 2.
  - text: 2 5
    why: older is also updated.
  answer: 1
- id: st18
  type: try
  title: Move the route counter twice
  starter: |
    older, newer = 1, 1
    for step in range(2, 4):
        older, newer = newer, older + newer
    print(newer)
  task: Raise the stop from 4 to 5. Check that the number of routes to step 4 is 5.
  check:
    stdout_line: '5'
- id: st19
  type: code
  title: Count stairs routes without repeated calls
  exercise: exercises/practice.py
  function: route_count
  test_class: RouteCount
  hint_levels:
  - Start with the counts at 0 and 1.
  - From step 2 through n, replace the pair with the newer count and the sum.
  - Loop over range(2, n + 1). Use older, newer = newer, older + newer, then return newer.
- id: st20
  type: predict
  title: What work is still waiting after the call?
  code: |
    def audit(level):
        print("open", level)
        if level > 0:
            audit(level - 1)
        print("close", level)

    audit(1)
  choices:
  - text: |
      open 1
      close 1
      open 0
      close 0
    why: The child runs before the caller can close.
  - text: |
      open 1
      open 0
      close 0
      close 1
    why: The child closes first. A loop version must keep the older close action pending.
  - text: |
      open 1
      open 0
      close 1
      close 0
    why: The older call waits until the new call has finished.
  - text: |
      open 1
      close 1
    why: Level zero stops calling itself. It still prints its own open and close lines.
  answer: 1
- id: st21
  type: try
  title: Save the close action for later
  starter: |
    pending = [("open", 1)]
    emitted = []
    while pending:
        action, level = pending.pop()
        emitted.append(f"{action} {level}")
        if action == "open":
            if level > 0:
                pending.append(("open", level - 1))
            pending.append(("close", level))
    print(emitted)
  task: |
    Each pair holds a message and a level. Place the push for close before
    the nested if. Then the child will run before its parent's close.
    Check that the loop emits the same four messages as audit(1).
  check:
    stdout_line: "['open 1', 'open 0', 'close 0', 'close 1']"
