unit: s2.m05.u05
python_min: '3.9'
steps:
- id: st01
  type: read
  title: Choose what to keep when calls become a loop
  body: |
    A service reads a report with thousands of nested groups. A recursive
    scan can hit the depth limit. You will rewrite calls as loops.
    For a straight chain, save just the values needed next.
    For nested groups, keep a list of work still to do.

    A **tail call** is the last action in its caller. A loop can update
    the arguments like a tail call and go back to its top.
- id: st02
  type: predict
  title: What does the tail call carry?
  code: |
    def bytes_used(n, total):
        if n == 0:
            return total
        return bytes_used(n - 1, total + 4)

    print(bytes_used(2, 0))
  choices:
  - text: '12'
    why: The base case returns before adding another 4.
  - text: '8'
    why: The frames receive (2, 0), (1, 4), and (0, 8). All return 8.
  - text: '4'
    why: There are two updates before the base case.
  - text: '0'
    why: The base frame returns its total, not its n.
  answer: 1
- id: st03
  type: try
  title: Update two values in a loop
  starter: |
    n = 2
    total = 0
    while n > 0:
        n -= 1
        total += 4
    print(total)
  task: Change the starting n to 3. Confirm the total grows by one block of 4.
  check:
    stdout_line: '12'
- id: st04
  type: read
  title: Trace the same states in one frame
  body: |
    ```text
    calls:   bytes_used(2, 0) -> bytes_used(1, 4) -> bytes_used(0, 8)
    returns: 8                <- 8                <- 8
    loop:    (n=2, total=0)   -> (n=1, total=4)   -> (n=0, total=8)
    ```

    In the loop there are no waiting frames to return through. When a
    new value uses the old n, compute it before changing n.
- id: st05
  type: predict
  title: Read n before you change it
  code: |
    n, total = 3, 0
    while n > 0:
        n -= 1
        total += n
    print(total)
  choices:
  - text: '0'
    why: Only the last pass adds zero.
  - text: '5'
    why: The value 3 is reduced before any addition.
  - text: '3'
    why: The loop adds the new values 2, 1, and 0.
  - text: '6'
    why: That would add n before the decrement.
  answer: 2
- id: st06
  type: fix
  title: Match the recursive update order
  task: The first pass must add n. Return n + (n - 1) + ... + 1.
  starter: |
    def work(n):
        total = 0
        while n > 0:
            n -= 1
            total += n
        return total
  solution: |
    def work(n):
        total = 0
        while n > 0:
            total += n
            n -= 1
        return total
  tests: |
    import ast
    import inspect

    nodes = list(ast.walk(ast.parse(inspect.getsource(work))))
    assert not any(isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
                   and node.func.id == "work" for node in nodes), (
        "work must not call itself. Use a loop instead."
    )
    assert any(isinstance(node, ast.While) for node in nodes), "work must use a while loop."

    assert work(3) == 6
    assert work(1) == 1
    assert work(0) == 0
  hint_levels:
  - Compare the first addition with the recursive call's arguments.
  - Use the old n to update total before lowering n.
  - Move total += n just above n -= 1.
  explanation: The updated total must include work for the current n.
- id: st07
  type: code
  title: Replace recursive discount steps with a loop
  exercise: exercises/practice.py
