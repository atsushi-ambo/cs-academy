- id: st08
  type: read
  title: Store branches in a list
  body: |
    An **explicit stack** is a list you manage yourself. Use append to
    **push** work onto its end. Use pop() to take the last item off.
    This is **last in, first out**. The last thing added runs first.

    ```text
    stack (top at right): [] -> ["later"] -> ["later", "now"]
    pop() gives "now"; "later" stays on the stack
    ```

    To visit items from left to right, push them right to left.
- id: st09
  type: predict
  title: Push in the order that runs left first
  code: |
    stack = ["file C"]
    stack.append("file B")
    stack.append("file A")
    print(stack.pop())
    print(stack.pop())
  choices:
  - text: |
      file C
      file B
    why: pop here uses the end, not the start.
  - text: |
      file A
      file A
    why: Each pop removes its result.
  - text: |
      file B
      file C
    why: file A is at the end before the first pop.
  - text: |
      file A
      file B
    why: pop removes the right end. The last file pushed is first out.
  answer: 3
- id: st10
  type: parsons
  title: Take the last pending job
  task: Push two tasks and print the one that was pushed last.
  lines:
  - stack = ["night report"]
  - stack.append("urgent report")
  - job = stack.pop()
  - print(job)
  expected_stdout: urgent report
- id: st11
  type: read
  title: Trace nested batches without calls
  body: |
    Start with the entire list as the only pending item. When you pop
    a list, push its items in reverse order. When you pop a number, output it.
    `reversed(batch)` lets a for loop read a list from right to left.

    ```text
    stack (top right)          action
    [[1, [2, 3], 4]]          open the outer batch
    [4, [2, 3], 1]            emit 1
    [4, [2, 3]]               open the inner batch
    [4, 3, 2]                 emit 2, then 3, then 4
    ```

    Each row shows work still to do. The top of the stack is the next item.
- id: st12
  type: predict
  title: What if you push in input order?
  code: |
    stack = []
    for file in ["first", "middle", "last"]:
        stack.append(file)
    while stack:
        print(stack.pop())
  choices:
  - text: |
      last
      middle
      first
    why: The loop processes the most recent push first.
  - text: |
      first
      middle
      last
    why: This would need pushes in reverse order.
  - text: |
      last
      first
      middle
    why: After removing last, middle is at the end.
  - text: last
    why: The loop continues until the stack is empty.
  answer: 0
- id: st13
  type: try
  title: Try reversing the pushes
  starter: |
    stack = []
    for file in ["first", "middle", "previous-last"]:
        stack.append(file)
    emitted = []
    while stack:
        emitted.append(stack.pop())
    print(emitted)
  task: Wrap the list in reversed(...). Check that the emitted list follows the input order.
  check:
    stdout_line: "['first', 'middle', 'previous-last']"
- id: st14
  type: fix
  title: Keep the first item on top
  task: Return all sizes in left-to-right order. You can use reversed() before pushing.
  starter: |
    def unpack(batch):
        pending = [batch]
        result = []
        while pending:
            item = pending.pop()
            if isinstance(item, list):
                for child in item:
                    pending.append(child)
            else:
                result.append(item)
        return result
  solution: |
    def unpack(batch):
        pending = [batch]
        result = []
        while pending:
            item = pending.pop()
            if isinstance(item, list):
                for child in reversed(item):
                    pending.append(child)
            else:
                result.append(item)
        return result
  tests: |
    import ast
    import inspect

    nodes = list(ast.walk(ast.parse(inspect.getsource(unpack))))
    assert not any(isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
                   and node.func.id == "unpack" for node in nodes), (
        "unpack must not call itself. Use a loop instead."
    )
    assert any(isinstance(node, ast.While) for node in nodes), "unpack must use a while loop."
    assert any(isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute)
               and node.func.attr == "pop" for node in nodes), (
        "unpack must pop from an explicit stack."
    )

    assert unpack([1, [2, 3], 4]) == [1, 2, 3, 4]
    assert unpack([[], [0]]) == [0]
  hint_levels:
  - Which child should be popped first?
  - Put the leftmost child at the end of pending.
  - Iterate over reversed(item) when you push children.
  explanation: Reversing the push order makes the pop order left to right, just like the recursive version.
- id: st15
  type: code
  title: Flatten a deeply nested export with a stack
  exercise: exercises/practice.py
  function: unpack_sizes
