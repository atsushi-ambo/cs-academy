- id: st17
  type: read
  title: A call can split into two choices
  body: |
    You can climb a step or jump two steps. Count the ways to reach
    step n. The first move leaves n - 1 or n - 2 steps. Add the two counts.
    Zero steps left means one finished route. Fewer than zero means no route.

    ```text
    ways(3) waits for ways(2) and ways(1)
      ways(2) waits for ways(1) and ways(0)
        ways(1) gets 1 from ways(0) and 0 from ways(-1), then returns 1
      ways(2) gets 1 from ways(1) and 1 from ways(0), then returns 2
      ways(1) gets 1 from ways(0) and 0 from ways(-1), then returns 1
    ways(3) gets 2 and 1, then returns 3
    ```

    Both branches ask for ways(1). Each returns 1. ways(2) returns 2
    and ways(3) returns 3. Repeated work grows fast as n grows.
- id: st18
  type: predict
  title: Count three-step routes
  code: |
    def ways(n):
        if n == 0:
            return 1
        if n < 0:
            return 0
        return ways(n - 1) + ways(n - 2)

    print(ways(3))
  choices:
  - text: '4'
    why: Paths that go past the target count as zero.
  - text: '6'
    why: The branches add counts; they do not multiply them.
  - text: '3'
    why: The routes are 1+1+1, 1+2, and 2+1. Their order matters.
  - text: '2'
    why: Jumps of 1 then 2 and 2 then 1 are different routes.
  answer: 2
- id: st19
  type: try
  title: Count how often the same job returns
  starter: |
    def ways(n):
        if n == 0:
            return 1
        if n < 0:
            return 0
        if n == 1:
            print("one step")
        return ways(n - 1) + ways(n - 2)

    print(ways(3))
  task: Change ways(3) at the bottom to ways(4). Count the "one step" lines before the final result.
  check:
    stdout_line: '5'
