- id: st16
  type: fix
  title: Use a fixed number of label checks
  task: |2

    Count four checks per box. n is an integer from 0 to 80.
    Change the inner loop so its length is fixed. Keep both for loops.
    Sample: label_checks(2) -> 8
  starter: |
    def label_checks(n):
        checks = 0
        for box in range(n):
            for label in range(n):
                checks += 1
        return checks
  solution: |
    def label_checks(n):
        checks = 0
        for box in range(n):
            for label in range(4):
                checks += 1
        return checks
  tests: |
    import ast
    import inspect
    import sys

    source, first_line = inspect.getsourcelines(label_checks)
    loops = [node for node in ast.walk(ast.parse("".join(source))) if isinstance(node, ast.For)]
    assert len(loops) == 2, "Keep both for loops."
    outer, inner = sorted(loops, key=lambda loop: loop.lineno)
    assert any(inner is node for stmt in outer.body for node in ast.walk(stmt)), "Keep the inner loop."
    outer_line = first_line + outer.lineno - 1
    inner_line = first_line + inner.lineno - 1

    def work(n):
        visits = {outer_line: 0, inner_line: 0}

        def trace(frame, event, arg):
            if frame.f_code is not label_checks.__code__:
                return None
            if event == "line" and frame.f_lineno in visits:
                visits[frame.f_lineno] += 1
            return trace

        previous_trace = sys.gettrace()
        sys.settrace(trace)
        try:
            result = label_checks(n)
        finally:
            sys.settrace(previous_trace)
        return result, visits[outer_line], visits[inner_line]

    # Each for header runs once per iteration and once more at exhaustion.
    for n in (0, 2, 4, 19, 80):
        assert work(n) == (4 * n, n + 1, 5 * n), "Visit four labels per box."
  hint_levels:
  - The inside length should not grow with n.
  - A box always has four labels.
  - Use range(4) inside range(n).
  explanation: There are four inner passes for each box. Time is O(n) and extra space is O(1).
