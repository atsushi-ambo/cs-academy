unit: s2.m02.u01
python_min: '3.9'
steps:
- id: st01
  type: read
  title: Count work before you time it
  body: |
    A library checks returned books. Let **n** be the number of returns.
    Choose one **operation** to count, such as checking a book number.
    In our model each check costs about the same.

    If every book needs three checks, we count 3n checks.
    **Big-O** is an **upper bound** on how fast a cost grows.
    We usually give the tightest class that fits.
    3n and n are both O(n), called **linear** growth.
- id: st02
  type: predict
  title: Three checks for each return
  code: |
    n = 4
    checks = 0
    for book in range(n):
        checks += 3
    print(checks)
  choices:
  - text: '4'
    why: There are four books, with three checks each.
  - text: '7'
    why: Each book adds three checks. Three is a factor, not a one-time fee.
  - text: '12'
    why: Four groups of three give twelve. The growth is still O(n).
  - text: '81'
    why: The checks add up. They are not a power of three.
  answer: 2
- id: st03
  type: try
  title: Double the returns
  starter: |
    n = 4
    checks = 0
    for book in range(n):
        checks += 1
    print(checks)
  task: Set n to 8. Check that twice as many books need twice as many checks.
  check:
    stdout_line: '8'
- id: st04
  type: read
  title: Fixed fees and fixed groups
  body: |
    Opening a box takes one action. Checking all n items takes n more.
    The count is n + 1, and the class is O(n). For n at least 1, this count is at most 2n.
    This is one way to show an upper bound.

    Two full passes take 2n checks. A loop inside a loop does not always mean n².
    If the inside loop has exactly four passes per item, the count is 4n.
- id: st05
  type: predict
  title: An inside loop of fixed length
  code: |
    checks = 0
    for book in range(6):
        for corner in range(4):
            checks += 1
    print(checks)
  choices:
  - text: '10'
    why: Four checks run for each book, not once at the end.
  - text: '24'
    why: Six books have four corners each. With n books, this is O(n).
  - text: '36'
    why: The inner loop runs four times per book, not six.
  - text: '4'
    why: The inner loop repeats for each of the six books.
  answer: 1
- id: st06
  type: parsons
  title: Count two full passes
  task: Use all lines. Count one check per item, then one per label. There are 3 of each. Output is 6.
  lines:
  - checks = 0
  - 'for item in range(3):'
  - '    checks += 1'
  - 'for label in range(3):'
  - '    checks = checks + 1'
  - print(checks)
  accepted_orders:
  - [0, 1, 4, 3, 2, 5]
  expected_stdout: '6'
  hint_levels:
  - Put the counter first.
  - Each pass adds three.
  - Print only after both loops.
- id: st07
  type: code
