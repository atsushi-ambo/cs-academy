- id: st13
  type: read
  title: Count only the work that happens
  body: |
    Some pairs would repeat the same check. If A with B is the same as B with A,
    check each pair once. Start the inside loop after the outside index.

    With four items, the inside counts are 3, 2, 1, 0.
    The total is n × (n − 1) / 2. The factor of one half reduces the exact count.
    The growth stays O(n²).
- id: st14
  type: predict
  title: A triangle of pairs
  code: |
    pairs = 0
    for left in range(4):
        for right in range(left + 1, 4):
            pairs += 1
    print(pairs)
  choices:
  - text: '4'
    why: The inner loop sometimes adds more than one pair.
  - text: '16'
    why: That would count both orders and pairs of an item with itself.
  - text: '6'
    why: There are three, then two, then one, then zero new pairs.
  - text: '12'
    why: That counts two orders for each pair.
  answer: 2
