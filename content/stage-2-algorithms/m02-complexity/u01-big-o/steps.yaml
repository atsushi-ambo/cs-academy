- id: st08
  type: read
  title: When both loops grow
  body: |
    Suppose each returned book must match against every shelf record.
    If there are n returns and n records, the count is n × n.
    That is **quadratic** growth, O(n²). If the two list sizes can change
    on their own, name them separately. With a returns and b records, there are a × b comparisons.
    The total time is O(a + a × b), including one outer-loop pass per return even when b is zero.

    The two passes you arranged earlier gave 2n, O(n), using just one counter.
- id: st09
  type: predict
  title: Compare each return to all three records
  code: |
    pairs = 0
    for book in range(5):
        for record in range(3):
            pairs += 1
    print(pairs)
  choices:
  - text: '8'
    why: The record loop runs for every book, so the counts multiply.
  - text: '5'
    why: Each book adds three pairs.
  - text: '25'
    why: The number of records is three, not five.
  - text: '15'
    why: Five books times three records gives fifteen pairs.
  answer: 3
- id: st10
  type: fix
  title: Keep the count across all rows
  task: |2

    Return the number of scans for rows rows with places places in each row.
    Both inputs are integers from 0 to 40. Keep the nested loops.
    Sample: scan_places(2, 3) -> 6
  starter: |
    def scan_places(rows, places):
        count = 0
        for row in range(rows):
            count = 0
            for place in range(places):
                count += 1
        return count
  solution: |
    def scan_places(rows, places):
        count = 0
        for row in range(rows):
            for place in range(places):
                count += 1
        return count
  tests: |
    import ast
    import inspect

    assert scan_places(2, 3) == 6
    assert scan_places(0, 3) == 0
    assert scan_places(4, 0) == 0
    assert scan_places(4, 3) == 12
    nodes = ast.walk(ast.parse(inspect.getsource(scan_places)))
    assert any(isinstance(node, (ast.For, ast.While))
               and any(isinstance(child, (ast.For, ast.While))
                       for stmt in node.body for child in ast.walk(stmt))
               for node in nodes), "Keep the nested loops."
  hint_levels:
  - Look for two places that set the count to zero.
  - Start from zero only before the outer loop.
  - Remove count = 0 inside the first loop.
  explanation: Each row adds places scans. Time is O(1 + rows + rows × places). Extra space is O(1).
- id: st11
  type: predict
  title: Drop a fixed fee when naming the class
  code: |
    n = 10
    checks = 5
    for item in range(n):
        checks += 2
    print(checks)
  choices:
  - text: '25'
    why: The count is 5 + 2n. The fee and factor leave the growth class at O(n).
  - text: '20'
    why: The five setup checks still matter to the exact count.
  - text: '15'
    why: Each item adds two checks, not one.
  - text: '50'
    why: The setup cost of five is paid once.
  answer: 0
- id: st12
