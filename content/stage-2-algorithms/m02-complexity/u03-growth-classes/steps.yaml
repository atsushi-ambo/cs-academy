unit: s2.m02.u03
python_min: '3.9'
steps:
- id: st01
  type: read
  title: Read the shape of a cost
  body: |
    Let n be the number of jobs. A **constant** cost stays the same as n grows.
    A **logarithmic** cost can come from repeatedly halving n.
    A **linear** cost can come from one pass over the jobs.
    A **polynomial** cost can come from a fixed number of nested full loops.
    Two loops give n² checks. Three give n³.
- id: st02
  type: predict
  title: Read one slot from a longer list
  code: |
    jobs = [7, 4, 2, 9, 6]
    print(jobs[0])
  choices:
  - text: '7'
    why: The index finds the first slot directly. It takes O(1) time.
  - text: '6'
    why: Index zero is at the start.
  - text: '5'
    why: That is the list length.
  - text: '[7, 4, 2, 9, 6]'
    why: Indexing gives just one item.
  answer: 0
- id: st03
  type: try
  title: Add a third full loop
  starter: |
    n = 2
    checks = 0
    for left in range(n):
        for middle in range(n):
            for right in range(n):
                checks += 1
    print(checks)
  task: Set n to 3. Count all triples, including repeated indexes.
  check:
    stdout_line: '27'
- id: st04
  type: read
  title: Follow one path or both paths
  body: |
    If a tour has one yes-or-no choice at each stop, it has 2ⁿ full plans.
    A complete route ends at a **leaf**, a call with no more children.
    At depth zero there is one call. Each extra level in this tree has twice as many.
    This is **exponential** growth. In n², n is the base and 2 is fixed.
    In 2ⁿ, 2 is the base and n is the exponent.
- id: st05
  type: predict
  title: Count leaves from three switches
  code: |
    def settings(n):
        if n == 0:
            return 1
        return settings(n - 1) + settings(n - 1)

    print(settings(3))
  choices:
  - text: '3'
    why: There are three choices to make along each path.
  - text: '6'
    why: Every new switch doubles the number of whole settings.
  - text: '8'
    why: Three levels of two choices give 2 × 2 × 2 settings.
  - text: '15'
    why: That counts all calls, including the ones above the leaves.
  answer: 2
- id: st06
  type: parsons
  title: Put the branching rule after the base case
  task: Use all lines. Count the full settings for two switches. The empty setting counts as one. Output
    is 4.
  lines:
  - 'def settings(n):'
  - '    if n == 0:'
  - '        return 1'
  - '    return settings(n - 1) + settings(n - 1)'
  - print(settings(2))
  expected_stdout: '4'
  hint_levels:
  - Stop when nothing is left.
  - The two calls follow yes and no.
  - Add both answers after the base case.
- id: st07
  type: code
  title: Count a single halving path
  exercise: exercises/practice.py
  function: half_path
  test_class: HalfPath
  hint_levels:
  - At size 1, no cuts remain.
  - One cut leaves size // 2.
  - Add one to half_path(size // 2).
- id: st08
  type: read
  title: All calls or only finished plans
  body: |
    In the line puzzle, only the leaves counted as plans. To count all calls,
    count the current call as well. With two choices left, the levels have
    1, 2, and 4 calls. The total is 7.

    Only one path is active at a time. A call waits for its first child to finish
    before making its next call. Time and peak memory can grow at different rates.

    The line puzzle visits O(2ⁿ) calls. Its deepest path holds O(n) frames at once.
- id: st09
  type: predict
  title: Check the size of a call tree
  code: |
    def calls(levels):
        if levels == 0:
            return 1
        return 1 + calls(levels - 1) + calls(levels - 1)

    print(calls(2))
  choices:
  - text: '4'
    why: There are four leaves and three calls above them.
  - text: '7'
    why: The total is 1 + 2 + 4.
  - text: '3'
    why: There are three levels, with several calls on two of them.
  - text: '8'
    why: The total is one less than eight.
  answer: 1
- id: st10
  type: fix
  title: Count both choices at each stop
  task: |2

    Count every call in the tree for n yes-or-no choices. Use two recursive calls at each split.
    Input: an integer from 0 to 10. Include the current call even at zero.
    Sample: tour_calls(2) -> 7
  starter: |
    def tour_calls(n):
        if n == 0:
            return 1
        return 1 + tour_calls(n - 1)
  solution: |
    def tour_calls(n):
        if n == 0:
            return 1
        return 1 + tour_calls(n - 1) + tour_calls(n - 1)
  tests: |
    import ast
    import inspect

    for n, count in ((0, 1), (1, 3), (2, 7), (5, 63), (10, 2047)):
        assert tour_calls(n) == count
    nodes = ast.walk(ast.parse(inspect.getsource(tour_calls)))
    assert sum(isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
               and node.func.id == "tour_calls" for node in nodes) == 2
  hint_levels:
  - One call at the current level counts as one.
  - There are two children when n is positive.
  - Add another tour_calls(n - 1).
  explanation: The solution visits O(2ⁿ) calls and uses O(n) extra stack space.
- id: st11
  type: predict
  title: Which count doubles with each new switch?
  code: |
    print(2 ** 4, 2 ** 5)
  choices:
  - text: 8 10
    why: The ** operator raises 2 to a power.
  - text: 16 25
    why: Those are squares of 4 and 5.
  - text: 16 30
    why: One more power of two doubles 16.
  - text: 16 32
    why: Each old setting has two choices for the new switch.
  answer: 3
- id: st12
  type: try
  title: Watch two branches multiply the leaves
  starter: |
    def settings(n):
        if n == 0:
            return 1
        return settings(n - 1) + settings(n - 1)

    print(settings(4))
  task: Change the call at the bottom to settings(5). Check the new count.
  check:
    stdout_line: '32'
- id: st13
  type: read
  title: Try every order or count them directly
  body: |
    For four jobs, there are four first choices. Each leaves three second choices.
    Then come two choices and finally one. Multiply 4 × 3 × 2 × 1 to get 24.
    We write this product as 4!, read as four **factorial**. For zero jobs, one empty order is possible.

    Listing all orders visits at least n! leaves. Writing n job names for each
    order takes at least n × n! writes. If you only need the count, you can
    multiply the factors in one pass. Here we count small-number arithmetic as one step.
- id: st14
  type: predict
  title: Count five-job orders from four-job orders
  code: |
    four_jobs = 24
    print(5 * four_jobs)
  choices:
  - text: '120'
    why: Each of five first choices leaves 24 possible orders.
  - text: '29'
    why: Five new branches use multiplication, not addition.
  - text: '25'
    why: Five choices do not repeat at every position.
  - text: '32'
    why: This is not a yes-or-no tree.
  answer: 0
- id: st15
  type: code
  title: Count orders without making them
  exercise: exercises/practice.py
  function: order_count
  test_class: OrderCount
  hint_levels:
  - Begin with one empty order.
  - Each factor changes how many orders are possible.
  - Multiply total by each choice count from 1 to n.
- id: st16
  type: fix
  title: Keep the empty order
  task: |2

    Return the number of orders for n jobs. Use recursion with one child when n is positive.
    n is an integer from 0 to 12.
    Sample: job_plans(3) -> 6
  starter: |
    def job_plans(n):
        if n == 0:
            return 0
        return n * job_plans(n - 1)
  solution: |
    def job_plans(n):
        if n == 0:
            return 1
        return n * job_plans(n - 1)
  tests: |
    import ast
    import inspect

    for n, count in ((0, 1), (1, 1), (3, 6), (7, 5040)):
        assert job_plans(n) == count
    nodes = ast.walk(ast.parse(inspect.getsource(job_plans)))
    assert sum(isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
               and node.func.id == "job_plans" for node in nodes) == 1
  hint_levels:
  - The zero-job case has one order.
  - A zero makes every product zero.
  - Return 1 in the base case.
  explanation: One call runs for each size from n down to zero. Time and extra stack space are O(n) in
    our small-number model.
- id: st17
  type: predict
  title: Count cubic work as n grows
  code: |
    for n in [2, 4]:
        print(n * n * n)
  choices:
  - text: |-
      4
      16
    why: These are squares.
  - text: |-
      8
      16
    why: All three factors double.
  - text: |-
      8
      64
    why: This is n³, a polynomial. Doubling n multiplies the count by eight.
  - text: |-
      8
      24
    why: The input is used as a factor three times, not multiplied by three.
  answer: 2
- id: st18
  type: code
  title: Plan checks for three slots
  exercise: exercises/practice.py
  function: triple_checks
  test_class: TripleChecks
  hint_levels:
  - Count the choices for just one role.
  - The other two roles each have the same number.
  - Multiply n by n by n.
- id: st19
  type: explain
  title: Explain two kinds of fast growth
  prompt: Write 2–3 English sentences. Compare the number of switch settings with the number of orders
    for distinct jobs.
  rubric:
  - Explain where 2ⁿ comes from.
  - Explain why the number of choices for job orders falls by one after each pick.
