      def sort_with_cut(values):
          def partition(lo, hi):
              pivot = values[lo]
              i = lo - 1
              j = hi + 1
              while True:
                  i += 1
                  while values[i] < pivot:
                      i += 1
                  j -= 1
                  while values[j] > pivot:
                      j -= 1
                  if i >= j:
                      return j
                  values[i], values[j] = values[j], values[i]

          def order(lo, hi):
              if lo < hi:
                  cut = partition(lo, hi)
                  order(lo, cut)
                  order(cut + 1, hi)

          order(0, len(values) - 1)
    tests: |
