- id: st11
  type: read
  title: Lomuto partition puts the pivot in its final place
  body: |
    A **partition** moves values into groups around a **pivot**, a value used to split the list.
    For **Lomuto partition**, choose the final value in the range as pivot.
    Use included ends lo and hi. Scan from lo through hi - 1. Let store start at lo.
    Whenever a value is at most the pivot, swap it with the value at store. Then advance store.
    Before each check, values before store are at most the pivot. Checked values from store onward are larger.
    After the scan, swap the pivot into store. Its index separates the two groups.
- id: st12
  type: predict
  title: Where does the last-item pivot land?
  code: |
    def lomuto_partition(values, lo, hi):
        pivot = values[hi]
        store = lo
        for i in range(lo, hi):
            if values[i] <= pivot:
                values[store], values[i] = values[i], values[store]
                store += 1
        values[store], values[hi] = values[hi], values[store]
        return store

    values = [6, 2, 5, 3]
    print(lomuto_partition(values, 0, 3), values)
  choices:
  - text: 3 [6, 2, 5, 3]
    why: The pivot starts at 3, but the final swap moves it.
  - text: 1 [2, 3, 5, 6]
    why: Only 2 goes to the left group. The final swap puts 3 at index 1.
  - text: 2 [2, 5, 3, 6]
    why: The scan does not move 5 into the left group because 5 exceeds 3.
  - text: 1 [2, 3, 6, 5]
    why: That is a valid split, but the final swap puts the displaced 6 last.
  answer: 1
