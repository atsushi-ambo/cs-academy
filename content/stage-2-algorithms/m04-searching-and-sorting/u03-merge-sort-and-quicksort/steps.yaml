- id: st23
  type: fix
  title: 'Challenge: a cut is not a finished pivot'
  task: Fix this in-place Hoare quicksort for 0 to 256 integers. Return None. For [4, 7, 3, 1], change
    the list to [1, 3, 4, 7]. Do not use a library sort.
  starter: |
    def sort_with_cut(values):
        def partition(lo, hi):
            pivot = values[lo]
            i = lo - 1
            j = hi + 1
            while True:
                i += 1
                while values[i] < pivot:
                    i += 1
                j -= 1
                while values[j] > pivot:
                    j -= 1
                if i >= j:
                    return j
                values[i], values[j] = values[j], values[i]

        def order(lo, hi):
            if lo < hi:
                cut = partition(lo, hi)
                order(lo, cut - 1)
                order(cut + 1, hi)

        order(0, len(values) - 1)
  solution: |
    def sort_with_cut(values):
        def partition(lo, hi):
            pivot = values[lo]
            i = lo - 1
            j = hi + 1
            while True:
                i += 1
                while values[i] < pivot:
                    i += 1
                j -= 1
                while values[j] > pivot:
                    j -= 1
                if i >= j:
                    return j
                values[i], values[j] = values[j], values[i]

        def order(lo, hi):
            if lo < hi:
                cut = partition(lo, hi)
                order(lo, cut)
                order(cut + 1, hi)

        order(0, len(values) - 1)
  tests: |
    values = [4, 7, 3, 1]
    assert sort_with_cut(values) is None
    assert values == [1, 3, 4, 7]
    empty = []
    assert sort_with_cut(empty) is None and empty == []
    values = [3, 2, 1, 0]
    sort_with_cut(values)
    assert values == [0, 1, 2, 3]
    values = [4, 4, 4]
    sort_with_cut(values)
    assert values == [4, 4, 4]
  hint_levels: &id001
  - Trace the index skipped by both calls.
  - The left side includes the cut index. It may still be out of order.
  - Change the left call to order(lo, cut).
  explanation: Hoare returns the last index of the left group. Both groups must be sorted. Balanced
    time and stack space are O(n log n) and O(log n). Worst-case time and stack space are O(n²) and
    O(n).
