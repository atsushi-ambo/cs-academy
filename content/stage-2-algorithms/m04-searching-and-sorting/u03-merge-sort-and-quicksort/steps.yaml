- id: st05
  type: fix
  title: Finish the merge when one run ends
  task: Merge two sorted integer lists of up to 200 items each into a new list. Keep inputs unchanged.
    For [1, 4] and [2, 5], return [1, 2, 4, 5]. Do not use a library sort.
  starter: |
    def merge_numbers(left, right):
        result = []
        i, j = 0, 0
        while i < len(left) and j < len(right):
            if left[i] <= right[j]:
                result.append(left[i])
                i += 1
            else:
                result.append(right[j])
                j += 1
        return result
  solution: |
    def merge_numbers(left, right):
        result = []
        i, j = 0, 0
        while i < len(left) and j < len(right):
            if left[i] <= right[j]:
                result.append(left[i])
                i += 1
            else:
                result.append(right[j])
                j += 1
        return result + left[i:] + right[j:]
  tests: |
    assert merge_numbers([1, 4], [2, 5]) == [1, 2, 4, 5]
    assert merge_numbers([3, 5], [1]) == [1, 3, 5]
    assert merge_numbers([], [6, 6]) == [6, 6]
    assert merge_numbers([], []) == []
    left, right = [2, 2], [2]
    result = merge_numbers(left, right)
    assert result == [2, 2, 2] and result is not left and result is not right
    assert left == [2, 2] and right == [2]
  hint_levels:
  - Look at the indexes when the loop stops.
  - At least one side is done. Both slices can be added because an exhausted slice is empty.
  - Return result + left[i:] + right[j:].
  explanation: The rest of each run is already ordered. Appending those values keeps all input items.
    Time and extra space are O(L + R).
