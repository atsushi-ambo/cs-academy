- id: st15
  type: read
  title: Hoare partition returns a cut
  body: |
    **Hoare partition** scans from both ends. Use the first value as the pivot.
    Start i one before lo and j one after hi. Move i right to a value >= pivot.
    Move j left to a value <= pivot. Both scans stop on a tie.
    If i < j, swap the two items. Move both indexes again on the next pass.
    If i >= j, return j. This **cut** is the end of the left group.
    For a range of at least two items, lo <= j < hi with this pivot choice.
    The left group holds values <= pivot. The right group holds values >= pivot.
    The cut can hold a value other than the pivot.
- id: st16
  type: predict
  title: A cut can point at a different value
  code: |
    def hoare_partition(values, lo, hi):
        pivot = values[lo]
        i = lo - 1
        j = hi + 1
        while True:
            i += 1
            while values[i] < pivot:
                i += 1
            j -= 1
            while values[j] > pivot:
                j -= 1
            if i >= j:
                return j
            values[i], values[j] = values[j], values[i]

    values = [4, 9, 2, 6]
    cut = hoare_partition(values, 0, 3)
    print(cut, values[cut])
  choices:
  - text: 0 2
    why: The first swap exchanges 4 and 2. The scans cross with j at 0, where 2 now sits.
  - text: 1 4
    why: After that swap, i stops at 9 and j moves left past 9 to index 0.
  - text: 2 4
    why: The pivot moves to index 2, but the cut is the final j.
  - text: 0 4
    why: The cut is at index 0, but its value changed in the swap.
  answer: 0
- id: st17
  type: code
  title: Partition a range from both ends
  exercise: exercises/practice.py
  function: hoare_partition
  test_class: HoarePartition
  hint_levels:
  - Save the first value before it can move.
  - Move each pointer at least once per pass. Stop both scans at a tie or an out-of-group value.
  - Return j once i >= j. Otherwise swap values[i] and values[j] and scan again.
- id: st18
  type: read
  title: Sort the correct sides of the split
  body: |
    Quicksort partitions first, then sorts the two groups. Stop when the range has fewer than two items.
    With Lomuto, the pivot is in place. Sort lo through p - 1, and p + 1 through hi.
    With Hoare, sort lo through j and j + 1 through hi. The cut may still need sorting.

    These versions move items **in place**. This means they change the original list.
    They use no full-size merge list. They still need space for calls that have yet to return.
    A helper inside your function can use values from the outer function.
    A distant swap can flip two equal keys. These versions do not promise stability.
- id: st19
  type: predict
  title: Should the left recursive call include the cut?
  code: |
    lo, cut, hi = 1, 2, 5
    left = list(range(lo, cut + 1))
    right = list(range(cut + 1, hi + 1))
    print(left, right)
  choices:
  - text: '[1] [3, 4, 5]'
    why: This leaves out the cut. A Hoare cut still needs sorting.
  - text: '[1, 2] [2, 3, 4, 5]'
    why: The right range begins after the cut, so there is no overlap.
  - text: '[1, 2] [3, 4]'
    why: The stop hi + 1 includes the last index hi.
  - text: '[1, 2] [3, 4, 5]'
    why: Both original ends are included. The cut belongs to the left range.
  answer: 3
- id: st20
  type: read
  title: Pivot choice changes the shape of the calls
  body: |
    A **balanced split** makes the two groups close in size. It leads to O(log n) levels.
    Each full level checks O(n) items, so balanced quicksort takes O(n log n) time.
    A last-item Lomuto pivot on sorted input leaves one empty group. This repeats at each level.
    Its **worst case**, or largest cost for that input size, is O(n²) time and O(n) stack space.

    Choosing a random pivot reduces the chance of repeated bad splits on distinct keys.
    A middle index often helps with ordered input, but its value need not be near the middle value.
    Even a random pivot leaves a one-sided split if all values tie under the Lomuto rule above.
- id: st21
  type: predict
  title: Comparison count after repeated bad pivots
  code: |
    size = 5
    checks = 0
    while size > 1:
        checks += size - 1
        size -= 1
    print(checks)
  choices:
  - text: '4'
    why: Four is just the cost of the first partition.
  - text: '5'
    why: The loop counts comparisons at each size, not the number of input values.
  - text: '10'
    why: The partitions check 4, 3, 2, then 1 values.
  - text: '15'
    why: Each scan excludes its pivot. A single-item range has no partition.
  answer: 2
