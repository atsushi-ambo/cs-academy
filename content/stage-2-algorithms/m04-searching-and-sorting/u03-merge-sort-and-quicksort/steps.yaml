- id: st08
  type: read
  title: Merge sort splits by position
  body: |
    Split the input near its middle. Sort both halves by the same rule and merge them.
    Sizes zero and one are already sorted. Return a copy at that point.

    Each level does O(n) work across all runs. For powers of two the recurrence is T(n) = 2T(n/2) + O(n).
    There are O(log n) levels for n ≥ 2, so time is O(n log n), even for reversed input.
    The merge lists take O(n) extra live space. A stable merge gives a stable sort at every level.
- id: st09
  type: predict
  title: Why is an empty list a base case?
  code: |
    def leaves(values):
        if len(values) <= 1:
            return 1
        mid = len(values) // 2
        return leaves(values[:mid]) + leaves(values[mid:])

    print(leaves([]), leaves([9, 8, 7]))
  choices:
  - text: 0 3
    why: An empty input returns one leaf because the first call stops there.
  - text: 1 2
    why: The half of length two splits again, giving two leaves on that side.
  - text: 0 2
    why: The code counts stopping calls, not only the two initial halves.
  - text: 1 3
    why: The empty call is a leaf. The three-item input splits into three one-item leaves.
  answer: 3
- id: st10
