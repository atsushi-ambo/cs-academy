unit: s2.m04.u03
python_min: '3.9'
steps:
- id: st01
  type: read
  title: Put two batches of log events together
  body: |
    Two servers send batches of events. Each batch is already in time order.
    You can join them by looking at just the next event in each batch.
    A sorted stretch of data is a **run**. Joining two runs in order is a merge.
    You will build **merge sort** from this step. Then you will build **quicksort**, which splits by value instead.
- id: st02
  type: read
  title: Pick the next item from two sorted runs
  body: |
    Keep indexes i and j into the two runs. Compare their current keys.
    Add the smaller item to a new list and move its index. For a tie, take the left item first.
    If the left run came first in the input, this keeps ties in their original order.

    Stop comparing once either run ends. Append the rest of the other run.
    Each item goes into the output once. Two runs of total length n take O(n) time and O(n) space.
- id: st03
  type: predict
  title: What should come first when times tie?
  code: |
    left = [(5, "left-a"), (5, "left-b")]
    right = [(5, "right-a")]
    i, j = 0, 0
    if left[i][0] <= right[j][0]:
        name = left[i][1]
        i += 1
    else:
        name = right[j][1]
        j += 1
    print(name, i, j)
  choices:
  - text: right-a 0 1
    why: The keys tie. The <= test chooses the left branch.
  - text: left-b 1 0
    why: Read the item at the old index before advancing it.
  - text: left-a 1 0
    why: The left item wins the tie. Only the left index moves.
  - text: left-a 1 1
    why: The right item is still waiting, so its index stays at 0.
  answer: 2
