unit: s2.m04.u02
python_min: '3.9'
steps:
- id: st01
  type: read
  title: Put small jobs in order
  body: |
    A server runs small jobs first. You have a list of job sizes to put in order.
    In this unit you will write three simple sorts. You will also count how much work each sort does.
    A **comparison** asks how two values are ordered. Count each such question about values in the list.
    Skip questions about loop indexes when you count.
- id: st02
  type: read
  title: Selection sort finds the next smallest item
  body: |
    In **selection sort**, the items before index start are already in their final positions.
    This is the **sorted prefix**. A prefix is the start of a list.
    Each **pass** scans the rest of the list to find its smallest item.
    Then **swap**, or trade, that item and the item at start.

    ```python
    values = [8, 4, 6]
    best = 0
    for i in range(1, len(values)):
        if values[i] < values[best]:
            best = i
    values[0], values[best] = values[best], values[0]
    ```

    The first pass puts 4 at the front. The other two values still need work.
- id: st03
  type: predict
  title: After the first selection pass
  code: |
    values = [7, 4, 3, 6]
    best = 0
    for i in range(1, len(values)):
        if values[i] < values[best]:
            best = i
    values[0], values[best] = values[best], values[0]
    print(values)
  choices:
  - text: '[3, 4, 6, 7]'
    why: One swap only fixes the first position.
  - text: '[3, 4, 7, 6]'
    why: The minimum is at index 2. The swap puts 7 at that index.
  - text: '[4, 7, 3, 6]'
    why: The scan keeps going after it finds 4. It finds 3 next.
  - text: '[3, 7, 4, 6]'
    why: A swap changes only the two selected positions.
  answer: 1
- id: st04
  type: try
  title: Count the scans as the list grows
  starter: |
    values = [1, 2, 3, 4]
    checks = 0
    for start in range(len(values)):
        for i in range(start + 1, len(values)):
            checks += 1
    print(checks)
  task: Use five values. The loops show where selection sort would compare items. Check the total.
  check:
    stdout_line: '10'
- id: st05
  type: predict
  title: Selection work on an already ordered list
  code: |
    values = [1, 2, 3, 4]
    checks = 0
    for start in range(len(values)):
        for i in range(start + 1, len(values)):
            checks += 1
    print(checks)
  choices:
  - text: '0'
    why: Selection sort still checks the remaining items before it can move on.
  - text: '4'
    why: There are four starts. Each start can cause more than one check.
  - text: '16'
    why: The inner loop scans only indexes after start.
  - text: '6'
    why: The scans count 3, 2, 1, then 0 checks.
  answer: 3
- id: st06
  type: read
  title: Why doubling the input costs about four times as much
  body: |
    Selection sort checks n - 1 items in the first scan. The next scan checks n - 2.
    The sum down to 1 is n * (n - 1) // 2. Pair the sum with the same sum in reverse to see why.
    For n = 4, pair 3 + 2 + 1 with 1 + 2 + 3. The three pairs give 12, so one sum is 6.

    This is **quadratic growth**. Doubling a large n brings the time close to four times as much.
    The count stays the same on ordered and reversed input.
- id: st07
  type: code
  title: Sort job sizes and count selection comparisons
  exercise: exercises/practice.py
  function: selection_report
  test_class: SelectionReport
  hint_levels:
  - Copy the list. Pick the first index in the unsorted part.
