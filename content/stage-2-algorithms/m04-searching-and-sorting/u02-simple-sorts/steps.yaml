- id: st11
  type: predict
  title: Does selection sort keep ties?
  code: |
    jobs = [(4, "first"), (4, "second"), (2, "small")]
    jobs[0], jobs[2] = jobs[2], jobs[0]
    print(jobs[1][1], jobs[2][1])
  choices:
