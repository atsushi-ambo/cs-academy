- id: st12
  type: code
  title: Sort records by priority while keeping ties
  exercise: exercises/practice.py
  function: insertion_jobs
  test_class: InsertionJobs
  hint_levels:
  - Treat the first record as already sorted.
  - Save the next record. Move left, shifting each larger record one place right.
  - Compare keys with >. Write the saved record at j + 1 after the shifts.
- id: st13
  type: fix
  title: Keep the arrival order of equal jobs
  task: Fix this stable insertion sort for up to 200 (integer size, string label) pairs. Return a new
    list by size. For [(2, "b"), (1, "x"), (2, "a")] return [(1, "x"), (2, "b"), (2, "a")]. Do not use
    a library sort.
  starter: |
    def order_ties(jobs):
        result = jobs[:]
        for i in range(1, len(result)):
            saved = result[i]
            j = i - 1
            while j >= 0 and result[j][0] >= saved[0]:
                result[j + 1] = result[j]
                j -= 1
            result[j + 1] = saved
        return result
  solution: |
    def order_ties(jobs):
        result = jobs[:]
        for i in range(1, len(result)):
            saved = result[i]
            j = i - 1
            while j >= 0 and result[j][0] > saved[0]:
                result[j + 1] = result[j]
                j -= 1
            result[j + 1] = saved
        return result
  tests: |
    assert order_ties([(2, "b"), (1, "x"), (2, "a")]) == [(1, "x"), (2, "b"), (2, "a")]
    assert order_ties([(5, "z"), (5, "a")]) == [(5, "z"), (5, "a")]
    assert order_ties([]) == []
    jobs = [(5, "x"), (1, "y")]
    result = order_ties(jobs)
    assert result == [(1, "y"), (5, "x")] and result is not jobs
    assert jobs == [(5, "x"), (1, "y")]
  hint_levels:
  - Trace two jobs with the same size.
  - The new job must stay after the older equal job.
  - Shift only when result[j][0] > saved[0].
  explanation: A strict comparison moves only larger keys, so ties keep their order. Worst-case time
    is O(n²) and extra space is O(n) for the returned copy.
- id: st14
  type: read
  title: Bubble sort moves a large value to the end
  body: |
    **Bubble sort** compares neighbors. Swap when the left value is greater than the right value.
    A left-to-right pass moves a largest remaining value to the right end.
    That value is in place. Leave it out on the next pass.

    If a full pass makes no swap, every pair checked is already in order.
    The part left out was already fixed, so the whole list is sorted. You can stop.
    Swapping only when the left key is larger makes this version stable.
- id: st15
  type: predict
  title: One pass over four neighbors
  code: |
    values = [5, 1, 4, 2]
    for j in range(len(values) - 1):
        if values[j] > values[j + 1]:
            values[j], values[j + 1] = values[j + 1], values[j]
    print(values)
  choices:
  - text: '[1, 2, 4, 5]'
    why: The largest item reaches the end, but the left part can still need work.
  - text: '[1, 5, 4, 2]'
    why: The pass continues after the first swap.
  - text: '[1, 4, 5, 2]'
    why: The pass also compares indexes 2 and 3.
  - text: '[1, 4, 2, 5]'
    why: The 5 moves right at each comparison until it reaches the end.
  answer: 3
- id: st16
  type: try
  title: See a smaller item move only one place left
  starter: |
    values = [5, 1, 4, 2]
    for j in range(len(values) - 1):
        if values[j] > values[j + 1]:
            values[j], values[j + 1] = values[j + 1], values[j]
    print(values)
  task: Change the input to [2, 3, 4, 1]. Run one pass. Does the 1 get all the way to the front?
  check:
    stdout_line: '[2, 3, 1, 4]'
- id: st17
  type: predict
  title: How many checks before an early stop?
  code: |
    values = [1, 2, 3, 4, 5]
    checks = 0
    for end in range(len(values) - 1, 0, -1):
        swapped = False
        for j in range(end):
            checks += 1
            if values[j] > values[j + 1]:
                values[j], values[j + 1] = values[j + 1], values[j]
                swapped = True
        if not swapped:
            break
    print(checks)
  choices:
  - text: '0'
    why: The code must check neighbors to learn that no swap is needed.
  - text: '4'
    why: The first pass checks all four pairs and stops with no swaps.
  - text: '5'
    why: There is one fewer neighboring pair than there are values.
  - text: '10'
    why: Ten checks would come from all four passes. The break stops after one.
  answer: 1
- id: st18
  type: code
  title: Count comparisons in bubble sort
  exercise: exercises/practice.py
  function: bubble_report
  test_class: BubbleReport
  hint_levels:
  - Track the last index still in the active part.
  - Check every pair up to that index. Mark whether any swap occurred.
  - For each j in range(end), compare j and j + 1. Break after the pass if swapped is False.
- id: st19
  type: fix
  title: 'Challenge: reset the swap flag for each pass'
  task: Return the bubble comparison count for up to 200 integers. Keep the input unchanged. Scan left
    to right and shrink after each pass. For [2, 1, 3, 4, 5], return 7. For [], return 0.
  starter: |
    def count_checks(values):
        result = values[:]
        checks = 0
        swapped = False
        for end in range(len(result) - 1, 0, -1):
            for j in range(end):
                checks += 1
                if result[j] > result[j + 1]:
                    result[j], result[j + 1] = result[j + 1], result[j]
                    swapped = True
            if not swapped:
                break
        return checks
  solution: |
    def count_checks(values):
        result = values[:]
        checks = 0
        for end in range(len(result) - 1, 0, -1):
            swapped = False
            for j in range(end):
                checks += 1
                if result[j] > result[j + 1]:
                    result[j], result[j + 1] = result[j + 1], result[j]
                    swapped = True
            if not swapped:
                break
        return checks
  tests: |
    assert count_checks([2, 1, 3, 4, 5]) == 7
    assert count_checks([1, 2, 3, 4, 5]) == 4
    assert count_checks([4, 3, 2, 1]) == 6
    assert count_checks([]) == 0
  hint_levels: &id001
  - Ask what the flag says in the second pass.
  - The flag should report swaps during the current pass only.
  - Move swapped = False to the first line inside the outer loop.
  explanation: Resetting the flag lets a quiet pass end the loop. Time is O(n) in the best case and
    O(n²) in the worst case. The copy uses O(n) extra space.
