- id: st08
  type: read
  title: Insertion sort opens a place for the next record
  body: |
    A **record** is one item with several pieces of data. Here it is a pair of a job size and a name.
    The size is the **key**, the field we compare. Two equal keys make a **tie**.
    A **stable sort** keeps ties in their input order.

    In **insertion sort**, take the next item and save it. **Shift** larger keys one place right.
    That opens a place where the saved item belongs. Stop when the item to the left is smaller or equal.
    The first item needs no work. This method keeps ties in order because it only shifts larger keys.
- id: st09
  type: predict
  title: Where does a later tie go?
  code: |
    jobs = [(2, "first"), (5, "large"), (2, "later")]
    job = jobs[2]
    j = 1
    while j >= 0 and jobs[j][0] > job[0]:
        jobs[j + 1] = jobs[j]
        j -= 1
    jobs[j + 1] = job
    print(jobs[1][1])
  choices:
  - text: later
    why: The size-5 record moves right. The saved job goes just after the first size-2 job.
  - text: first
    why: The original size-2 job stays at index 0.
  - text: large
    why: The size-5 job moves to index 2.
  - text: '2'
    why: The final [1] inside the pair selects the name, not the size.
  answer: 0
