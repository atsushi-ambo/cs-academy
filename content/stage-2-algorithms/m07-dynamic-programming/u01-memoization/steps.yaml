      to a nonnegative amount. Use recursion. count_one(3, 6) returns 1 and count_one(3, 5) returns 0.
      An empty choice pays 0. left is an integer from 0 to 400, so the recursion stays shallow.
    starter: |
      def count_one(coin, left):
          if left <= 0:
