unit: s2.m06.u06
python_min: '3.9'
steps:
- id: st01
  type: read
  title: Keep an ordered index short
  body: |
    Sorted server IDs can turn an ordinary BST into a long chain.
    A **balanced tree** keeps search paths short as keys arrive.
    An **AVL tree** is a BST with nearly equal child heights at each node.
    You will measure the difference and repair four kinds of lean. You will also see a second kind of balanced tree.
- id: st02
  type: read
  title: Read height and balance in constant time
  body: |
    Use height 0 for an empty link and 1 for a leaf.
    A node stores `1 + max(left_height, right_height)` in its .height attribute. This is its **cached height**.
    The **balance factor** is left height minus right height.
    At every AVL node, it must be -1, 0, or 1.
    After a link changes, refresh the height before a parent reads it.
    In code, `0 if node is None else node.height` means 0 when the link is empty, otherwise the stored height.
- id: st03
  type: predict
  title: Find the sign of a right-heavy tree
  code: |
    class Node:
        def __init__(self, key, left=None, right=None):
            self.key = key
            self.left = left
            self.right = right
            left_height = 0 if left is None else left.height
            right_height = 0 if right is None else right.height
            self.height = 1 + max(left_height, right_height)

    def height(node):
        return 0 if node is None else node.height

    def factor(node):
        return height(node.left) - height(node.right)

    root = Node(9, None, Node(14, Node(11)))
    print(factor(root))
  choices:
  - text: '2'
    why: A taller right side makes left minus right negative.
  - text: '-1'
    why: The right subtree has height 2, not 1.
  - text: '-2'
    why: The left height is 0 and the right height is 2.
  - text: '0'
    why: The root has one empty link and one subtree. Their heights differ.
  answer: 2
