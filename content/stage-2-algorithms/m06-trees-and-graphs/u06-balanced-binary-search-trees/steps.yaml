  expected_stdout: '12'
- id: st09
  type: fix
  title: Save the middle branch in a right rotation
  task: Repair links in a right rotation. The given root has a left child. Return the promoted child. For
    Node(20, Node(10, None, Node(15))), 15 becomes the left child of 20. This fix changes links only.
  starter: |
    class Node:
        def __init__(self, key, left=None, right=None):
            self.key = key
            self.left = left
            self.right = right
            left_height = 0 if left is None else left.height
            right_height = 0 if right is None else right.height
            self.height = 1 + max(left_height, right_height)

    def turn_right(root):
        pivot = root.left
        root.left = None
        pivot.right = root
        return pivot
  solution: |
    class Node:
        def __init__(self, key, left=None, right=None):
            self.key = key
            self.left = left
            self.right = right
            left_height = 0 if left is None else left.height
            right_height = 0 if right is None else right.height
            self.height = 1 + max(left_height, right_height)

    def turn_right(root):
        pivot = root.left
        root.left = pivot.right
        pivot.right = root
        return pivot
  tests: |
    old_root = Node(20, Node(10, None, Node(15)), Node(30))
    middle = old_root.left.right
    root = turn_right(old_root)
    assert root.key == 10 and root.right is old_root
    assert old_root.left is middle
    assert old_root.right.key == 30
    assert turn_right(Node(8, Node(4))).right.left is None
  hint_levels:
  - Find the key between the old root and its left child.
  - The pivot's old right link needs a new parent before you overwrite it.
  - Set root.left = pivot.right before setting pivot.right = root.
  explanation: The middle branch keeps its place in sorted order after the transfer. A rotation relinks
    a constant number of nodes in O(1) time and space.
- id: st10
  type: fix
  title: Refresh heights from the bottom
  task: Fix a left rotation that also updates .height. The root has a right child and all heights are correct
    before the turn. Turning Node(10, None, Node(20)) gives root 20 at height 2 and child 10 at height 1.
  starter: |
    class Node:
        def __init__(self, key, left=None, right=None):
            self.key = key
            self.left = left
            self.right = right
            left_height = 0 if left is None else left.height
            right_height = 0 if right is None else right.height
            self.height = 1 + max(left_height, right_height)
    def refresh(node):
        left = 0 if node.left is None else node.left.height
        right = 0 if node.right is None else node.right.height
        node.height = 1 + max(left, right)

    def rotate(root):
        pivot = root.right
        root.right = pivot.left
        pivot.left = root
        refresh(pivot)
        refresh(root)
        return pivot
  solution: |
    class Node:
        def __init__(self, key, left=None, right=None):
            self.key = key
            self.left = left
            self.right = right
            left_height = 0 if left is None else left.height
            right_height = 0 if right is None else right.height
            self.height = 1 + max(left_height, right_height)
    def refresh(node):
        left = 0 if node.left is None else node.left.height
        right = 0 if node.right is None else node.right.height
        node.height = 1 + max(left, right)

    def rotate(root):
        pivot = root.right
        root.right = pivot.left
        pivot.left = root
        refresh(root)
        refresh(pivot)
        return pivot
  tests: |
    root = rotate(Node(10, None, Node(20)))
    assert root.key == 20 and root.height == 2
    assert root.left.key == 10 and root.left.height == 1
    root = rotate(Node(8, None, Node(20, Node(12))))
    assert root.height == 3 and root.left.height == 2
  hint_levels: &id001
  - Which node becomes a child during the rotation?
  - Refresh that child before the new parent uses its height.
  - Call refresh(root) before refresh(pivot).
  explanation: After rotation, the old root is lower. Refreshing it first lets the new root read the correct
    child height. Time and extra space are O(1).
