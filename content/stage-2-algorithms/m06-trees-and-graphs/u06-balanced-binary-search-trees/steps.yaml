- id: st05
  type: code
  title: Read the balance factor of a node
  task: Return left height minus right height using each child's stored .height. A missing link and an empty
    root each give 0 for height or factor. Keep links and heights unchanged. Node(9, Node(4)) has factor
    1.
  exercise: exercises/practice.py
  function: balance_factor
  test_class: BalanceFactor
  hint_levels:
