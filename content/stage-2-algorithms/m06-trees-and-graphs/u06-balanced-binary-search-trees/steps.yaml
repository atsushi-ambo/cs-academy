- id: st13
  type: read
  title: Repair the four AVL insertion cases
  body: |
    Insert as in a BST. As each call returns, refresh its node and check the balance factor.
    The letters show the heavy side at that node and then at its heavy child.

    - **LL** means outside left. Rotate right at the node.
    - **RR** means outside right. Rotate left at the node.
    - **LR** means inside left. Rotate left at the left child, then right at the node.
    - **RL** means inside right. Rotate right at the right child, then left at the node.

    A factor above 1 is left heavy. A factor below -1 is right heavy.
    For the inside case, the heavy child's factor points the other way.
    Return each repaired root so the caller can keep its new link.
- id: st14
  type: predict
  title: Choose the repair for an LR lean
  code: |
    def repair_name(parent_factor, child_factor):
        if parent_factor > 1:
            if child_factor < 0:
                return "left child left, then root right"
            return "root right"
        if child_factor > 0:
            return "right child right, then root left"
        return "root left"

    print(repair_name(2, -1))
  choices:
  - text: root right
    why: A single rotation leaves the inner lean on the other side.
  - text: left child left, then root right
    why: The opposite signs show an LR case. Straighten the child first.
  - text: right child right, then root left
    why: Those turns are for an RL lean.
  - text: root left
    why: A positive factor means the extra height is on the left.
  answer: 1
- id: st15
  type: predict
  title: Choose the repair for a straight RR lean
  code: |
    def repair_name(parent_factor, child_factor):
        if parent_factor > 1:
            if child_factor < 0:
                return "left child left, then root right"
            return "root right"
        if child_factor > 0:
            return "right child right, then root left"
        return "root left"

    print(repair_name(-2, -1))
  choices:
  - text: root left
    why: Both factors lean right. A single left rotation repairs the outside lean.
  - text: root right
    why: This would move the shorter side up.
  - text: left child left, then root right
    why: The parent factor is negative, so the left branch is not the heavy one.
  - text: right child right, then root left
    why: Use that first turn at the right child only for an inner RL lean.
  answer: 0
- id: st16
  type: code
  title: Implement AVL insertion repairs
  task: Insert an integer into an AVL tree and return its updated root. Ignore duplicates. Use the given
    node maker and rotation functions. Complete all four repairs. For keys 30, 10, 20 in that order, return
    a tree with root 20, left 10, and right 30.
  exercise: exercises/practice.py
  function: avl_insert
  test_class: AvlInsert
  hint_levels:
  - Check the node's factor on the way back from insertion.
  - For a heavy side, check the sign of the child factor. Rotate that child first in an inside case.
  - When factor > 1, turn a right-heavy left child left, then turn root right. Mirror this for factor <
    -1.
- id: st17
  type: read
  title: Red-black trees use a different rule
  body: |
    A **red-black tree** marks each node red or black. Its root and its missing links count as black.
    A red node cannot have a red child.
    For a given subtree, every path from its root to a missing link has the same black count.
    Here, **black height** counts black nodes after the subtree root, including the missing link.
    Use items.count("black") to count black marks in a list.
    These rules keep paths within a constant factor of each other. They allow unequal ordinary heights.
    After inserts, a red-black tree can change marks as well as rotate.
- id: st18
  type: predict
  title: Spot two red nodes in a row
  code: |
    parent = "red"
    child = "red"
    print(parent == "black" or child == "black")
  choices:
  - text: 'True'
    why: This check needs at least one black endpoint.
  - text: red
    why: The comparisons produce Boolean values.
  - text: 'False'
    why: A red parent and a red child break the rule.
  - text: black
    why: The code checks labels without changing them.
  answer: 2
- id: st19
  type: predict
  title: Compare black counts on paths of different lengths
  code: |
    left = ["black", "black"]
    right = ["red", "black", "black"]
    print(left.count("black") == right.count("black"))
  choices:
  - text: 'False'
    why: The red node adds a step without adding to the black count.
  - text: '3'
    why: The print call compares two counts. It does not print the length.
  - text: '2'
    why: Both counts are 2, but the comparison prints a Boolean.
  - text: 'True'
    why: Both paths have two black entries. Their lengths may differ.
  answer: 3
