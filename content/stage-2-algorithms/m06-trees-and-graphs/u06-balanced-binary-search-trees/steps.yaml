  - Use zero for either missing link.
  - Subtract the saved right height from the saved left height.
- id: st06
  type: read
  title: A rotation moves links and keeps key order
  body: |
    A **rotation** changes which node is at the top of a small part of a BST.
    In a left rotation, the right child moves up. This child is the **pivot**.
    Its old left branch becomes the old root's right branch. Then the old root becomes its left child.

    ```text
      10                  20
        \                /
        20      ->      10
       /                  \
      15                  15
    ```

    20 moves above 10. Key 15 stays between them in sorted order.
    For a right rotation, swap left and right in these steps.
    Refresh the old root first and the pivot second. Return the pivot.
- id: st07
  type: predict
  title: Follow the branch between two keys
  code: |
    class Node:
        def __init__(self, key, left=None, right=None):
            self.key = key
            self.left = left
            self.right = right
            left_height = 0 if left is None else left.height
            right_height = 0 if right is None else right.height
            self.height = 1 + max(left_height, right_height)

    def turn_left(root):
        pivot = root.right
        root.right = pivot.left
        pivot.left = root
        return pivot

    root = turn_left(Node(10, None, Node(20, Node(15))))
    print(root.key, root.left.key, root.left.right.key)
  choices:
  - text: 10 20 15
    why: A left rotation moves the right child above the old root.
  - text: 20 15 10
    why: 15 fits on the right of 10, so it becomes that branch.
  - text: 20 10 20
    why: The old right link is replaced, so it no longer points to 20.
  - text: 20 10 15
    why: 20 moves up, 10 moves left, and the branch with 15 transfers to 10.
  answer: 3
- id: st08
  type: parsons
  title: Rewire a left rotation
  task: Each list holds [key, left, right]. Save the pivot, then move its old left link before you overwrite
    it.
  lines:
  - 'def rotate(root):'
