            root.left = add(root.left, key)
        elif key > root.key:
            root.right = add(root.right, key)
        return root

    root = None
    for key in [1, 2, 3, 4]:
        root = add(root, key)
    print(root.key)
  task: Change the input order to [2, 1, 3, 4]. Run it and check the root. Which key now goes to its left?
  check:
    stdout_line: '2'
- id: st21
  type: explain
  title: Explain a two-child deletion
  prompt: Write 2–4 English sentences. Explain how to delete a key with two children. Compare your draft
    with the model in the lesson.
  rubric:
  - Describe where to find the successor.
  - Say how to remove its original copy and keep any child.
  model_answer: Go right once, then go left until the path ends. Copy that key to the node being deleted.
    Remove the old copy from the right subtree and keep its right child if it has one.
