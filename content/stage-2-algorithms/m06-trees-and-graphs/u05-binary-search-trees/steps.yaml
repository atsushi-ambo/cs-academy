unit: s2.m06.u05
python_min: '3.9'
steps:
- id: st01
  type: read
  title: Keep server IDs in search order
  body: |
    A service stores active IDs. New IDs arrive, old IDs leave, and checks ask if an ID exists.
    A **key** is the value used for those comparisons.
    A **binary search tree (BST)** keeps all left keys smaller and all right keys larger at every node.
    This rule is an **invariant**, a condition every operation must preserve.
    In this unit, a **duplicate** is a repeated key. Keep only one copy of each key.
    You will insert, search, delete, and check the rule for a whole tree.
- id: st02
  type: read
  title: Use one branch per comparison
  body: |
    Start at the root. On a match, search is done. A smaller key goes left. A larger key goes right.
    An empty link ends a failed search. The nodes visited form the **search path**.
    Each Node now stores its comparison value in .key. Insertion puts a new leaf where search would stop.
    Return the root after insertion so the caller can keep it, even for an empty tree.
    A function can be passed as an argument. Here `make_node(key)` creates a node with empty links.
- id: st03
  type: predict
  title: Follow a search for 65
  code: |
    class Node:
        def __init__(self, key, left=None, right=None):
            self.key = key
            self.left = left
            self.right = right

    tree = Node(40, Node(15, None, Node(23)), Node(70, Node(65)))

    def trace(root, key):
        path = []
        while root is not None:
            path.append(root.key)
            if key == root.key:
                break
            if key < root.key:
                root = root.left
            else:
                root = root.right
        return path

    print(trace(tree, 65))
  choices:
  - text: '[40, 15, 23]'
    why: 65 is greater than 40, so the search skips the left side.
  - text: '[40, 70, 65]'
    why: Go right at 40, then left at 70. Stop on the match.
  - text: '[40, 70]'
    why: 65 is smaller than 70, whose left link exists.
  - text: '[40, 65]'
    why: 65 is below 70, so the path visits 70 before 65.
  answer: 1
- id: st04
  type: try
  title: Trace a missing ID
  starter: |
    class Node:
        def __init__(self, key, left=None, right=None):
            self.key = key
            self.left = left
            self.right = right

    tree = Node(40, Node(15, None, Node(23)), Node(70, Node(65)))

    def trace(root, key):
        path = []
        while root is not None:
            path.append(root.key)
            if key == root.key:
                break
            if key < root.key:
                root = root.left
            else:
                root = root.right
        return path

    print(trace(tree, 65))
  task: Search for 22 and check the visited keys. The search stops at the empty left link of 23.
  check:
    stdout_line: '[40, 15, 23]'
- id: st05
  type: parsons
  title: Follow one branch with recursion
  task: In the tuple, index 0 is the key, 1 is left, and 2 is right. Test for None before reading the key.
  lines:
  - 'def has(node, key):'
  - '    if node is None:'
  - '        return False'
