unit: s2.m06.u03
python_min: '3.9'
steps:
- id: st01
  type: read
  title: Trace connections between machines
  body: |
    A group of servers can pass a message along links.
    Which machines can receive it? How many links does the message cross?
    You will trace a network, find groups, and fill part of a grid.

    A **graph** has points called **vertices** and links called **edges**.
    Two points joined by an edge are **neighbors**.
    An **undirected** edge can be used both ways. A **directed** edge has one direction.
- id: st02
  type: read
  title: Store neighbors by list or matrix
  body: |
    An **adjacency list** maps each vertex to its neighbors.
    For links A–B and B–C, use `{"A": ["B"], "B": ["A", "C"], "C": ["B"]}`.
    An **adjacency matrix** uses a row and column per vertex.

    ```text
        A B C
    A   0 1 0
    B   1 0 1
    C   0 1 0
    ```

    Read a 1 as a link from the row vertex to the column vertex.
    The list holds O(V + E) values, where V counts vertices and E counts edges.
    The matrix holds O(V²) cells but checks any single edge in O(1) time.
- id: st03
  type: predict
  title: Read a matrix entry in the right direction
  code: |
    links = [[0, 1], [0, 0]]
    print(links[1][0], links[0][1])
  choices:
  - text: 0 1
    why: There is a link from 0 to 1 only.
  - text: 1 0
    why: The code prints row 1 first, then row 0.
  - text: 1 1
    why: The graph is directed. One link does not create its reverse.
  - text: 0 0
    why: Row 0 has a link to vertex 1.
  answer: 0
- id: st04
  type: read
  title: Visit all points one hop farther first
  body: |
    A **traversal** visits points by following edges.
    **Breadth-first search (BFS)** uses a queue to visit by distance from the start.
    A **hop** is one edge. The start has distance zero.
    Use `deque` from collections. `append` adds at the back and `popleft` removes the front.
    The **frontier** holds work you have found and still need to process.

    Add a vertex to the **visited set** as soon as it enters the queue.
    A dictionary of known distances can act as that set.
- id: st05
  type: predict
  title: Use first-in, first-out order
  code: |
    from collections import deque

    frontier = deque(["api", "db"])
    frontier.append("cache")
    print(frontier.popleft())
  choices:
  - text: cache
    why: pop would remove the last item, but this code uses popleft.
  - text: api
    why: popleft removes the oldest item, which is api.
  - text: db
    why: api is still in front of db.
  - text: '[''api'', ''db'', ''cache'']'
    why: popleft returns one item and removes it from the queue.
  answer: 1
- id: st06
  type: try
  title: Watch the queue drain
  task: Remove the first item with frontier.popleft() before the print line. Which item is now at the
