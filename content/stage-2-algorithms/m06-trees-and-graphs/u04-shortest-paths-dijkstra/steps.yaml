- id: st09
  type: fix
  title: Ignore a heap entry replaced by a cheaper one
  task: 'Given popped (cost, node) pairs and a dict of their best known costs, return only pairs whose
    cost equals the best. Keep order and duplicates. Every node has a best cost. Example: current([(4,
    ''db''), (9, ''db'')], {''db'': 4}) returns [(4, ''db'')]. Leave inputs unchanged.'
  starter: |
    def current(entries, best):
        kept = []
        for cost, node in entries:
            if cost != best[node]:
                kept.append((cost, node))
        return kept
  solution: |
    def current(entries, best):
        kept = []
        for cost, node in entries:
            if cost == best[node]:
                kept.append((cost, node))
        return kept
  tests: |
    entries = [(4, 'db'), (9, 'db'), (4, 'db'), (5, 'api')]
    best = {'db': 4, 'api': 5}
    assert current(entries, best) == [(4, 'db'), (4, 'db'), (5, 'api')]
    assert entries == [(4, 'db'), (9, 'db'), (4, 'db'), (5, 'api')]
    assert best == {'db': 4, 'api': 5}
    assert current([], {}) == []
  hint_levels:
  - When the same host appears twice, which cost does best still hold for it?
  - Compare a popped cost with the best known cost for that node.
  - Append only when cost == best[node].
  explanation: The old heap entry can stay until popped. Checking n entries takes O(n) time and at most
    O(n) space for the output.
- id: st10
  type: code
  title: Compute best latencies to every reachable host
  task: 'Implement Dijkstra with heapq. graph maps string hosts to lists of (host, nonnegative integer
    latency) pairs. Every neighbor has a key. Return a dict of minimum latencies including start at 0.
    Omit unreachable hosts. Return {} if start is absent. Keep graph unchanged. Example: latencies({''api'':
    [(''db'', 4)], ''db'': []}, ''api'') returns {''api'': 0, ''db'': 4}.'
  exercise: exercises/practice.py
  function: latencies
  test_class: Latencies
  hint_levels:
  - Keep a heap of possible routes and a dict of best costs.
  - Pop the cheapest pair. Skip an old pair. For each edge, add its weight.
  - When candidate is smaller or the neighbor is new, update best[neighbor] and push (candidate, neighbor).
- id: st11
  type: predict
  title: Read the up-to-date pair before the old pair
  code: |
    from heapq import heappop, heappush

    heap = [(12, "db")]
    best = {"db": 7}
    heappush(heap, (7, "db"))
    kept = []
    while heap:
        cost, node = heappop(heap)
        if cost == best[node]:
            kept.append(cost)
    print(kept)
  choices:
  - text: '[7, 12]'
    why: The old cost stays in the heap but is skipped after removal.
  - text: '[7]'
    why: The smaller pair leaves first. The old cost fails the equality check.
  - text: '[12]'
    why: The heap pops 7 first, and 12 no longer matches best.
  - text: '[]'
    why: The pair with 7 still matches the dictionary.
  answer: 1
- id: st12
  type: read
  title: Save predecessors as you improve costs
  body: |
    A **predecessor** is the node just before another on a chosen route.
    When a cost improves, store the node that gave the improvement.
    Updating both dictionaries keeps the route matched to its cost.
    For **path reconstruction**, walk from target back to start using predecessors.
    Then reverse the collected list with `path[::-1]`.
    An **unreachable** target has no route from the start.
- id: st13
  type: fix
  title: Read the route in travel order
  task: 'Follow parent links back from target and return the route from start to target. All links lead
    to start. Leave parent unchanged. Example: route({''db'': ''cache'', ''cache'': ''api''}, ''api'',
    ''db'') returns [''api'', ''cache'', ''db'']. If start equals target, return a one-item list.'
  starter: |
    def route(parent, start, target):
        path = [target]
        while target != start:
            target = parent[target]
            path.append(target)
        return path
  solution: |
    def route(parent, start, target):
        path = [target]
        while target != start:
            target = parent[target]
            path.append(target)
        return path[::-1]
  tests: |
    parent = {'db': 'cache', 'cache': 'api'}
    assert route(parent, 'api', 'db') == ['api', 'cache', 'db']
    assert parent == {'db': 'cache', 'cache': 'api'}
    assert route({}, 'api', 'api') == ['api']
  hint_levels: &id001
  - Look at which end of path you fill first.
  - Return the collected path in reverse order.
  - Change the return to path[::-1].
  explanation: The parent chain gives the route backwards. For a path with k hosts, collecting and reversing
    use O(k) time and O(k) space.
- id: st14
  type: code
  title: Trace a route with an optional missing target
  task: 'The dict parent maps each reached node other than start to its predecessor. Every chain ends
    at start. Return the list from start to target, or [] if target was not reached. Do not change parent.
    Example: trace_route({''z'': ''a''}, ''a'', ''z'') returns [''a'', ''z''].'
  exercise: exercises/practice.py
  function: trace_route
  test_class: TraceRoute
  hint_levels:
  - Check whether the target has a predecessor unless it is start.
  - Walk back one link at a time.
  - Start path with target. Append parent[path[-1]] until start, then return path[::-1].
- id: st15
  type: read
  title: Use only nonnegative weights
  body: |
    A **nonnegative** weight is zero or greater.
    A **settled distance** is a best cost that cannot get smaller.
    With nonnegative weights, a current minimum pair settles its node.
    Any route through a later pair starts at an equal or larger cost.
    A negative edge can break this rule. For example, 5 + (−4) can beat 2.
    You can stop at the first current target pair only under the nonnegative rule.
- id: st16
  type: predict
  title: A negative edge can break the early stop
  code: |
    from heapq import heappop, heappush

    heap = [(2, "target")]
    heappush(heap, (5, "relay"))
    cost, node = heappop(heap)
    print(node, cost, 5 + (-4))
  choices:
  - text: relay 5 1
    why: The heap orders candidates by known cost, so 2 leaves before 5.
  - text: target 1 1
    why: The route through relay has not been explored when the target is popped.
  - text: target 2 1
    why: The target comes out first, but a later negative edge could give a cost of 1.
  - text: target 2 9
    why: Adding a negative weight lowers the relay cost.
  answer: 2
- id: st17
  type: code
  title: 'Boss: return the cheapest path and its cost'
  task: 'Use heapq and Dijkstra to return (cost, path) for a graph of string hosts. Each neighbor has
    a key. Each edge is a (host, nonnegative integer latency) pair. path lists hosts from start through
    target. Any equal-cost best path is valid. Return (None, []) for an absent host or unreachable target.
    Leave graph unchanged. Example: lowest_latency({''a'': [(''b'', 3)], ''b'': []}, ''a'', ''b'') returns
    (3, [''a'', ''b'']).'
  exercise: exercises/practice.py
  function: lowest_latency
  test_class: LowestLatency
  hint_levels:
  - Store a parent whenever you improve a distance.
  - Skip stale heap entries before checking the target.
  - At a current target pair, follow parent to start and reverse the path. Return (None, []) if the heap
    empties first.
- id: st18
  type: explain
  title: Explain it to a teammate
  prompt: Write 2–4 English sentences. Explain why the first current pair for the target gives its minimum
    cost. After writing, compare with the model answer in the lesson.
  rubric:
  - Describe the ordering of pending costs.
  - Explain what the nonnegative condition guarantees.
  model_answer: The heap removes the least cost among the pending routes. I skip a pair if its cost is
    old. Any remaining route can only add nonnegative cost, so it cannot beat the current target cost.
- id: st19
  type: terminal
  title: 'Hands-on: run and change the sample'
  guide: handson.md
  check: The original sample prints the expected output in the guide.
