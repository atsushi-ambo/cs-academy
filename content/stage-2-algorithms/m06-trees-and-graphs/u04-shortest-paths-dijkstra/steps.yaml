unit: s2.m06.u04
python_min: '3.9'
steps:
- id: st01
  type: read
  title: Find a route that takes less time
  body: |
    A request can cross several network links before it reaches a server.
    Each link has a **weight**, such as **latency** in milliseconds.
    A **weighted graph** gives a cost to each edge.
    You will find the lowest **total cost**, the sum of the weights along a path.
    You will also find which links form that path.
- id: st02
  type: predict
  title: The route with fewer hops can take longer
  code: |
    direct = [12]
    relay = [3, 4]
    print(len(direct), sum(direct), len(relay), sum(relay))
  choices:
  - text: 1 7 2 12
    why: The direct link weighs 12 on its own.
  - text: 12 1 7 2
    why: Each pair prints the length before the sum.
  - text: 1 12 2 7
    why: The one-hop route costs 12. The two-hop route costs only 7.
  - text: 1 12 2 4
    why: Sum adds both relay weights, 3 and 4.
  answer: 2
- id: st03
  type: read
  title: Take the cheapest known route next
  body: |
    BFS processes routes by number of hops. Its first visit can miss a cheaper route.
    **Dijkstra's algorithm** takes the currently cheapest candidate first.
    Use a **min-heap**, a **priority queue** where the smallest key comes out first.
    Python's `heapq.heappush(heap, item)` adds an item. `heappop(heap)` removes the smallest.
    Store `(cost, node)` pairs. Strings break cost ties in these examples.
- id: st04
  type: predict
  title: The heap compares cost before node name
  code: |
    from heapq import heappop, heappush

    heap = [(9, "api")]
    heappush(heap, (2, "db"))
    heappush(heap, (2, "cache"))
    print(heappop(heap))
  choices:
  - text: (2, 'cache')
    why: Both low costs are 2. The string cache sorts before db.
  - text: (9, 'api')
    why: The largest cost waits in the heap.
  - text: (2, 'db')
    why: Equal costs are compared by the second tuple field.
  - text: '2'
    why: heappop returns the full pair.
  answer: 0
- id: st05
  type: try
  title: Make the relay-first item cheaper
  task: Change the cost of db to 1. Observe which pair leaves the heap first.
  starter: |
    from heapq import heappop, heappush

    heap = [(9, "api")]
    heappush(heap, (2, "db"))
    heappush(heap, (2, "cache"))
    print(heappop(heap))
  check:
    stdout_line: (1, 'db')
- id: st06
  type: read
  title: Improve a candidate and keep the best cost
  body: |
    Start with cost 0 at the source. Missing nodes have no known cost yet.
    For an edge of weight w from a node with cost d, try the new cost d + w.
    Save it only if it improves the **tentative distance**, the best cost found so far.
    This check and update is called **relaxation**.
    Push a new pair for each improvement. An old pair is a **stale entry**.
    When you pop a pair, skip it if its cost differs from the best cost.
- id: st07
  type: predict
  title: A later route can lower the best cost
  code: |
    best = {"db": 12}
    via = 3 + 4
    if via < best["db"]:
        best["db"] = via
    print(best["db"])
  choices:
  - text: '12'
    why: The current cost can change before it is settled.
  - text: '4'
    why: The last edge is just part of the route.
  - text: '19'
    why: The new route replaces the old cost rather than adding to it.
  - text: '7'
    why: The route adds both weights and replaces 12 with 7.
  answer: 3
- id: st08
  type: parsons
  title: Set a new best distance and queue it
  task: Store the improvement before pushing it. Pop the cheap pair and print it.
  lines:
  - from heapq import heappop, heappush
  - heap = [(12, "db")]
  - 'best = {"db": 12}'
  - 'if 7 < best["db"]:'
  - '    best["db"] = 7'
  - '    heappush(heap, (best["db"], "db"))'
  - print(heappop(heap))
  expected_stdout: (7, 'db')
  accepted_orders:
  - - 0
    - 2
    - 1
    - 3
    - 4
    - 5
    - 6
  - - 1
    - 0
    - 2
    - 3
    - 4
    - 5
    - 6
  - - 1
    - 2
    - 0
    - 3
    - 4
    - 5
    - 6
  - - 2
    - 0
    - 1
    - 3
    - 4
    - 5
    - 6
  - - 2
