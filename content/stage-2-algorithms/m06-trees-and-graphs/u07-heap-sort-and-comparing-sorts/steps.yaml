  plus:
  - type: fix
    task: Fix a downward sift for an integer max-heap prefix. Index i is inside a non-empty prefix. Only
      its value may be too small. Update the list in place and return None. Sifting [3, 9, 11, 20] at i
      = 0 with end = 1 must leave it unchanged.
    starter: |
      def sift_down_max(values, i, end):
          while 2*i + 1 < len(values):
              child = 2*i + 1
              right = child + 1
              if right < end and values[right] > values[child]:
                  child = right
              if values[i] >= values[child]:
                  break
              values[i], values[child] = values[child], values[i]
              i = child
    solution: |
      def sift_down_max(values, i, end):
          while 2*i + 1 < end:
              child = 2*i + 1
              right = child + 1
              if right < end and values[right] > values[child]:
                  child = right
              if values[i] >= values[child]:
                  break
              values[i], values[child] = values[child], values[i]
              i = child
    tests: |
      values = [3, 9, 11, 20]
      assert sift_down_max(values, 0, 1) is None
      assert values == [3, 9, 11, 20]
      values = [3, 5, 20]
      sift_down_max(values, 0, 2)
      assert values == [5, 3, 20]
