- id: st16
  type: code
  title: Write level order
  task: Use a first-in, first-out queue. Return a new list in level order. Leave all node links as they
    are. For Node(4, Node(9, Node(1)), Node(2)), return [4, 9, 2, 1]. For None, return [].
  exercise: exercises/practice.py
  function: level_order
  test_class: LevelOrder
  hint_levels:
  - Keep a queue of nodes you still need to visit.
  - Take from the front and append the left and right children that exist.
  - Use deque([root]), then queue.popleft() inside while queue.
- id: st17
  type: read
  title: Measure height and count leaves
  body: |
    Here, **height** counts nodes on the longest path from the root down to a leaf.
    An empty tree has height 0. One node has height 1.
    Add 1 to the larger child height at each node.
    Count a leaf only when both child links are empty. For other nodes, add both subtree counts.
- id: st18
  type: predict
  title: Height counts the deepest path
  code: |
    def height(node):
        if node is None:
            return 0
        return 1 + max(height(node[1]), height(node[2]))

    tree = ("a", ("b", None, ("d", None, None)), ("c", None, None))
    print(height(tree))
  choices:
  - text: '2'
    why: This counts links along the deepest path. The function counts nodes.
  - text: '4'
    why: This counts every node, including the short branch.
  - text: '3'
    why: The longest path contains a, b, and d.
  - text: '1'
    why: The function calls itself to measure both children.
  answer: 2
- id: st19
  type: fix
  title: Count only nodes with no children
  task: Return the leaf count for (value, left, right) tuples, or 0 for None. Preserve the input. The tree
    ("a", ("b", None, None), None) has one leaf.
  starter: |
    def count(node):
        if node is None:
            return 0
        value, left, right = node
        if left is None or right is None:
            return 1
        return count(left) + count(right)
  solution: |
    def count(node):
        if node is None:
            return 0
        value, left, right = node
        if left is None and right is None:
            return 1
        return count(left) + count(right)
  tests: |
    assert count(("a", ("b", ("d", None, None), ("e", None, None)), None)) == 2
    assert count(("a", None, None)) == 1
    assert count(None) == 0
    assert count(("a", None, ("b", ("c", None, None), ("d", None, None)))) == 2
    assert count(("a", ("b", None, None), None)) == 1
  hint_levels:
  - Try a node with only one child that has two leaves.
  - Check both missing links together.
  - Use and between left is None and right is None.
  explanation: One missing link still leaves a subtree to search. Each node is checked once in O(n) time.
    The recursion uses O(h) stack space.
- id: st20
  type: try
  title: Make the tree one level taller
  starter: |
    def height(node):
        if node is None:
            return 0
        return 1 + max(height(node[1]), height(node[2]))

    tree = ("a", ("b", None, None), None)
    print(height(tree))
  task: Give b a left child c with two empty links. Run the program and check the height.
  check:
    stdout_line: '3'
- id: st21
  type: code
  title: Measure height and leaf count together
  task: Return (height, leaves) in one recursive traversal of Node objects. Height counts nodes. Keep links
    unchanged. For Node(1, Node(2), None), return (2, 1). For None, return (0, 0).
  exercise: exercises/practice.py
  function: tree_stats
  test_class: TreeStats
  hint_levels:
  - Handle the empty link and a real leaf first.
  - Get one pair from each child. Combine heights and counts in different ways.
  - Return (1 + max(left_height, right_height), left_leaves + right_leaves) for an internal node.
- id: st22
  type: explain
  title: Describe two visit orders
  prompt: Write 2–4 English sentences. Explain when preorder visits a parent and when level order visits
    it. Compare your draft with the model in the lesson.
  rubric:
  - Say how preorder finishes a subtree.
  - Say why the queue finishes a level first.
  model_answer: Preorder visits the parent first, then finishes the left subtree before starting the right.
    Level order visits the parent first too. A queue keeps nodes already on a level ahead of their children.
