  exercise: exercises/practice.py
  function: postorder
  test_class: Postorder
  hint_levels:
  - Where does the current value go in this order?
  - Use one result list and a recursive helper with a None base case.
  - 'For a real node, run these three actions: visit(node.left), visit(node.right), out.append(node.value).'
- id: st13
  type: read
  title: Visit one level at a time
  body: |
    **Level order** visits nodes from top to bottom and left to right within each level.
    This is a breadth-first traversal. Use a queue, where the first node added leaves first.
    Import `deque` from `collections`. A deque supports fast operations at both ends.
    Start with `deque([root])`. Take the first node with `popleft()`. Add its children with `append()`.
    The **width** is the most nodes on any one level.
- id: st14
  type: predict
  title: Finish the level before the grandchild
  code: |
    class Node:
        def __init__(self, value, left=None, right=None):
            self.value = value
            self.left = left
            self.right = right

    from collections import deque

    tree = Node("web", Node("api", Node("db")), Node("cdn"))
    queue = deque([tree])
    while queue:
        node = queue.popleft()
        print(node.value)
        if node.left is not None:
            queue.append(node.left)
        if node.right is not None:
            queue.append(node.right)
  choices:
  - text: |
      web
      api
      cdn
      db
    why: After api leaves, cdn is ahead of db in the queue.
  - text: |
      web
      api
      db
      cdn
    why: That finishes the api subtree first.
  - text: |
      web
      cdn
      api
      db
    why: The left child goes into the queue before the right child.
  - text: |
      db
      api
      cdn
      web
    why: The queue starts with the root.
  answer: 0
