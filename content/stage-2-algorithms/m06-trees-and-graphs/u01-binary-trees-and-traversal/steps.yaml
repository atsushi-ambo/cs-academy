unit: s2.m06.u01
python_min: '3.9'
steps:
- id: st01
  type: read
  title: Walk a tree of service checks
  body: |
    A status page groups checks under services. Each group may have smaller groups.
    A **tree** shows these links. Each item is a **node**. The top node is the **root**.
    A **parent** has links to its **children**. Each node below the root has one parent.
    A **binary tree** has at most two children per node, called left and right.
    A node and all nodes below it form a **subtree**. A **leaf** has no children.
    You will build nodes, choose four visit orders, and measure how much they visit.
- id: st02
  type: read
  title: Build a node with two optional links
  body: |
    Use a class to keep a value and two child links together.
    When a child is missing, its link is `None`. Here, values are short labels.

    ```python
    class Node:
        def __init__(self, value, left=None, right=None):
            self.value = value
            self.left = left
            self.right = right
    root = Node("api", Node("db"))
    ```

    The root holds “api”. Its left child holds “db”. Its right link is empty.
    For the next exercise, Node is inside make_node so your work fits in one editor block.
- id: st03
  type: predict
  title: Read the right link
  code: |
    class Node:
        def __init__(self, value, left=None, right=None):
            self.value = value
            self.left = left
            self.right = right

    root = Node("web", Node("cache"))
    print(root.right is None)
  choices:
  - text: 'False'
    why: The second argument sets the left link only.
  - text: 'True'
    why: The right argument uses its default, None.
  - text: cache
    why: The cache node is linked on the left.
  - text: None
    why: The is test prints a Boolean.
  answer: 1
- id: st04
  type: code
  title: Create a node object
  task: Complete the Node class inside make_node. Return one new node with the given value and child links.
    Omitted links are None. For example, make_node("api", make_node("db")).left.value is "db".
  exercise: exercises/practice.py
  function: make_node
  test_class: MakeNode
  hint_levels:
  - Store a value and both links as attributes.
  - Inside __init__, assign each argument to the matching self attribute.
  - Set self.value, self.left, and self.right. The return line makes the object.
- id: st05
  type: read
  title: Visit before, between, or after the children
  body: |
    A **traversal** visits every node in a set order. A depth-first traversal finishes one subtree before the next.
    In **preorder**, visit the node, then its left subtree, then its right subtree.
    In **inorder**, visit left, then the node, then right.
    In **postorder**, visit left, then right, then the node.
    Stop a branch when its link is None. Append values to one shared result list.
    A helper can read and append to that list from inside the main function.
- id: st06
  type: predict
  title: A parent is visited first in preorder
  code: |
    tree = ("web", ("db", None, ("log", None, None)), ("cdn", None, None))

    def walk(node):
        if node is None:
            return
        value, left, right = node
        print(value)
        walk(left)
        walk(right)

    walk(tree)
  choices:
  - text: |
      db
      log
      web
      cdn
    why: That visits web after its left subtree.
  - text: |
      web
      db
      cdn
      log
    why: The db call finishes before cdn is visited.
  - text: |
      web
      db
      log
      cdn
    why: Each call prints its own value before either child.
  - text: |
      log
      db
      cdn
      web
    why: That prints each parent after both children.
  answer: 2
- id: st07
  type: parsons
  title: Build an inorder visit
  task: Use index 0 for the value, 1 for the left link, and 2 for the right link. Visit left before printing
    the value.
  lines:
  - 'def walk(node):'
  - '    if node is None:'
  - '        return'
  - '    walk(node[1])'
  - '    print(node[0])'
  - '    walk(node[2])'
  - walk(("A", ("B", None, None), None))
  expected_stdout: 'B

    A'
- id: st08
  type: predict
  title: Find the middle visit in inorder
  code: |
    tree = ("proxy", ("api", None, ("db", None, None)), ("cdn", None, None))

    def walk(node):
        if node is None:
            return
        value, left, right = node
        walk(left)
        print(value)
        walk(right)

    walk(tree)
  choices:
  - text: |
      proxy
      api
      db
      cdn
    why: The root is printed after the left call.
  - text: |
      api
      proxy
      db
      cdn
    why: The db visit is still part of the left call.
  - text: |
      api
      cdn
      db
      proxy
    why: The right subtree starts only after printing proxy.
  - text: |
      api
      db
      proxy
      cdn
    why: The left call prints api and db. Then the root and the right call print.
  answer: 3
- id: st09
  type: fix
  title: Return the parent last
  task: Fix order(node) to return postorder for a tree of (value, left, right) tuples or None. Leave the
    tree as it is. For ("a", None, ("b", None, None)), return ["b", "a"].
  starter: |
    def order(node):
        if node is None:
            return []
        value, left, right = node
        return [value] + order(left) + order(right)
  solution: |
    def order(node):
        if node is None:
            return []
        value, left, right = node
        return order(left) + order(right) + [value]
  tests: |
    assert order(("a", None, ("b", ("c", None, None), None))) == ["c", "b", "a"]
    assert order(("a", ("b", None, None), ("c", None, None))) == ["b", "c", "a"]
    assert order(None) == []
  hint_levels: &id001
  - Look at where the current value goes.
  - Build both subtree lists before adding the value.
  - Return order(left) + order(right) + [value].
  explanation: Adding the node last gives postorder. Repeated list copies take O(n²) time on a chain (O(nh)
    in general). Peak space is O(n + h), including result lists and frames.
- id: st10
  type: code
  title: Write preorder
  task: Return a new list of values in preorder. Use recursion. A missing link is None. Keep the .value,
    .left, and .right attributes unchanged. preorder(Node(4, Node(9), Node(2))) returns [4, 9, 2].
  exercise: exercises/practice.py
  function: preorder
  test_class: Preorder
  hint_levels:
  - Where does the current value go in this order?
  - Use one result list and a recursive helper with a None base case.
  - 'For a real node, run these three actions: out.append(node.value), visit(node.left), visit(node.right).'
- id: st11
  type: code
  title: Write inorder
  task: Return a new list of values in inorder. Use recursion. A missing link is None. Keep the .value,
