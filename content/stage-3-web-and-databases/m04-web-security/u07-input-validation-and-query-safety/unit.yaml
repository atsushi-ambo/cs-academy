- en: range
  ja: 値の範囲
- en: boundary value
  ja: 境界値
- en: path traversal
  ja: 許可した範囲をパスで逸脱すること
- en: absolute path
  ja: 絶対パス
- en: relative path
  ja: 相対パス
- en: resolve
  ja: パスを正規化しリンクをたどること
- en: symbolic link
  ja: 別のパスを参照するリンク
- en: parent directory
