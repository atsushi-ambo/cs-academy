id: s3.m04.u06
title: 'Hashing and signatures (HMAC): integrity of data you send'
stage: 3
module: Web Security
version: 1
status: draft
estimated_minutes: 80
prerequisites:
- s3.m04.u04
- s3.m04.u05
objectives:
- Distinguish hashes, HMACs, encryption, and public-key signatures.
- Sign and verify the bytes of a toy webhook.
- Accept old keys only within a planned rotation window.
