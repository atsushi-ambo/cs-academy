    - 4
    - 3
    - 2
    - 5
    - 6
  - - 1
    - 0
    - 4
    - 3
    - 2
    - 5
    - 6
  expected_stdout: '2'
- id: st07
  type: code
  title: Audit the six risk flags
  task: |
    audit(config) returns a list of issue strings in this order:
    "password", "repo-key", "authorization", "dependency", "permissions", "logging".
    config contains password_mode (plaintext, fast-hash, or salted-kdf), plus bool fields
    key_in_repo, checks_owner, patched, broad_access, logs_secrets.
    Report a password issue unless salted-kdf. Flag an exposed key, missing owner check, missing patch,
    broad access, and logs with secrets. Leave config unchanged. For a clean config return [].
  exercise: exercises/practice.py
  function: audit
  test_class: Audit
  hint_levels:
  - Turn each risk into one independent check.
  - The absence of an owner check and patch are both issues.
  - Append 'password' unless password_mode equals 'salted-kdf', then append the other five findings in
    order.
- id: st08
  type: read
  title: Look for signals and retain safe evidence
  body: |
    Watch for unusual read volumes, bursts of rejected requests, or new login locations.
    A signal is a clue. A batch job can make volume jump without a leak.
    Compare with a normal baseline and link events by request ID and time.
    Keep useful evidence with restricted access. Prevent fresh logs from collecting passwords or tokens.
- id: st09
  type: predict
  title: Which control would have kept a token out of logs?
  code: |
    event = {"request_id": "r7", "decision": "denied", "token": "toy"}
    log_fields = ("request_id", "decision")
    print("token" in event, "token" in log_fields)
  choices:
  - text: True True
    why: The allowlist contains just the two safe fields.
  - text: False True
    why: The event contains the token, but the allowlist omits it.
  - text: False False
    why: The field still exists in the incoming event.
  - text: True False
    why: A field allowlist keeps the token outside the log record.
  answer: 3
- id: st10
  type: fix
  title: Stop logging whole request records
  task: |
    safe_event(event) returns a fresh dictionary with request_id and decision.
    event always has those two safe fields as short strings. It can contain other fields and nested values.
    Keep event unchanged. Example: token="toy" in event must never add a token field to the result.
  starter: |
    def safe_event(event):
        return event.copy()
  solution: |
    def safe_event(event):
        return {"request_id": event["request_id"], "decision": event["decision"]}
  tests: |
    event = {"request_id": "r1", "decision": "denied", "token": "toy",
             "headers": {"Authorization": "toy"}}
    assert safe_event(event) == {"request_id": "r1", "decision": "denied"}
    assert event["headers"] == {"Authorization": "toy"}
    assert event["token"] == "toy"
    plain = {"request_id": "r2", "decision": "allowed"}
    assert safe_event(plain) == plain
    assert safe_event(plain) is not plain
  hint_levels:
  - Choose fields rather than removing a few known secrets.
  - Build a new record with the two safe keys.
  - 'Return {''request_id'': event[''request_id''], ''decision'': event[''decision'']}.'
  explanation: Selecting two fields gives average O(1) time and space for the fixed record.
- id: st11
  type: code
  title: Find a burst of access denials
  task: |
    denial_alert(events, limit) returns bool. events is a list from one time window.
    Each event has decision "denied" or "allowed". limit is a positive integer.
    Return True when at least limit denials appear. Do not modify events.
    Example: allowed, denied, denied at limit 2 returns True. This is a signal for review.
  exercise: exercises/practice.py
  function: denial_alert
  test_class: DenialAlert
  hint_levels:
  - Count denials within the window.
  - Skip allowed events. Compare the count to the limit.
  - Increment only on 'denied' and return True at count >= limit.
- id: st12
  type: read
  title: Contain and recover in a planned order
  body: |
    Containment stops further harm. Pause a risky export and revoke a leaked key.
    Preserve a timeline and relevant evidence. Identify which records and systems were affected.
    Rotate exposed secrets, close the cause, and check that old credentials fail.
    Force password resets for affected accounts and revoke their sessions when passwords may be exposed.
    Notify the incident lead and affected parties through the response plan. Notification may run during containment.
    Confirm the fix with allowed and denied tests. Add monitoring to detect a return of the issue.
- id: st13
  type: predict
  title: When does a rotated key stop working?
  code: |
    enabled = {"old", "fresh"}
    print("old" in enabled)
    enabled.remove("old")
    print("old" in enabled)
  choices:
  - text: |-
      False
      False
    why: Both keys are enabled before removal.
  - text: |-
      True
      False
    why: Adding a replacement leaves the older key valid. Revoking the old one stops it.
  - text: |-
      True
      True
    why: The code removes old from the active set.
  - text: |-
      False
      True
    why: The set loses an entry during containment.
  answer: 1
- id: st14
  type: fix
  title: Cut the export service's permissions
  task: |
    export_allowed(grants, action, table) returns bool.
    grants is a set of (action, table) string pairs from trusted policy.
    Allow only an exact grant. Keep grants unchanged.
    Example: with only ("read", "reports"), an action of "read" on "accounts" returns False.
  starter: |
    def export_allowed(grants, action, table):
        return any(grant[0] == action for grant in grants)
  solution: |
    def export_allowed(grants, action, table):
        return (action, table) in grants
  tests: |
    grants = {("read", "reports"), ("insert", "alerts")}
    assert export_allowed(grants, "read", "reports") is True
    assert export_allowed(grants, "read", "accounts") is False
    assert export_allowed(grants, "write", "reports") is False
    assert export_allowed(grants, "insert", "reports") is False
    assert export_allowed(set(), "read", "reports") is False
    assert grants == {("read", "reports"), ("insert", "alerts")}
  hint_levels:
  - The operation alone does not define the grant.
  - Compare action and table as a pair.
  - Return (action, table) in grants.
  explanation: An exact grant limits the service's access. Average time and extra space are O(1) for bounded
    keys.
- id: st15
  type: read
  title: Repair the route and verify the result
  body: |
    The export route uses two policies. The service needs access, and the actor must own the report.
    Check both policies before returning even a small part of the report.
    Write a safe decision event for both allowed and denied requests.
    Return only the report title in this exercise. The response does not need other fields.
- id: st16
  type: predict
  title: Which control would have stopped the wrong report read?
  code: |
    actor = "kai"
    report = {"owner": "lee"}
    service_read = True
    print(service_read, actor == report["owner"])
  choices:
  - text: False False
    why: The service has its table permission.
  - text: True True
    why: The service grant does not switch ownership.
  - text: True False
    why: The service can read the table, but the owner check rejects this actor.
  - text: False True
    why: The service grant is true and the IDs differ.
  answer: 2
- id: st17
  type: code
  title: 'Checkpoint: repair a toy report export'
  task: |
    export_title(actor, reports, report_id, grants, request_id, log) returns the title or None.
    actor is a trusted user ID or None. reports maps IDs to records with owner and title strings.
    grants is the service's set of (action, table) pairs. IDs, titles, and names are bounded strings.
    Allow only if ("read", "reports") is present, actor is identified, and the actor owns the report.
    Append exactly one dictionary with request_id and decision ("allowed" or "denied") to log.
    Do not change reports or grants. Example: the right owner without the grant is denied and logged.
  exercise: exercises/practice.py
  function: export_title
  test_class: ExportTitle
  hint_levels:
  - Separate the service's grant from the end user's permission.
  - Decide access, append one event, then return the title only on success.
  - Combine the exact grant, actor, record, and owner checks. Log only request_id and decision.
- id: st18
  type: predict
  title: Which control addresses a known flaw in a dependency?
  code: |
    inventory = {"installed": 2, "first_fixed": 3}
    print(inventory["installed"] >= inventory["first_fixed"])
  choices:
  - text: 'False'
    why: The installed toy version is below the first fixed version. Update and verify it.
  - text: 'True'
    why: Version 2 is below 3 in this numeric example.
  - text: '2'
    why: The expression compares version numbers.
  - text: '3'
    why: The expression checks the installed version against the fixed version.
  answer: 0
- id: st19
  type: explain
  title: Explain your first incident actions
  prompt: Write 2–4 English sentences. A fictitious export service logged an active key. Explain your
    first actions and how you would verify the fix. Check the model answer in the lesson after writing.
  rubric:
  - Name containment and revocation.
  - Preserve safe evidence and notify the incident lead.
  - Check that the fixed log omits credentials.
  model_answer: I pause the risky export and revoke the leaked key. I keep restricted evidence and notify
    the incident lead. After rotating the key, I check that the old one fails and that new logs contain
    only approved fields.
