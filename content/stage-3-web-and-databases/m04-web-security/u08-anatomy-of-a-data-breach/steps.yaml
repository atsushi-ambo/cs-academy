unit: s3.m04.u08
python_min: '3.9'
steps:
- id: st01
  type: read
  title: Trace a leak through an operations app
  body: |
    A toy report app stores credentials, exports reports, and writes logs.
    A data breach is unauthorized access to data or disclosure of that data.
    A root cause is a fault that let the incident happen. A control reduces that risk.
    You will audit the toy setup, repair the report route, and choose response actions.
- id: st02
  type: predict
  title: Which control limits a copied password table?
  code: |
    exposed = {"account": "toy", "password_mode": "plaintext"}
    control = {"plaintext": "salted slow KDF", "broad-role": "least privilege"}
    print(control[exposed["password_mode"]])
  choices:
  - text: least privilege
    why: Permissions can limit access, but they do not change copied plaintext.
  - text: HTML escaping
    why: This is a password storage issue.
  - text: salted slow KDF
    why: It removes plaintext from the intended storage design and makes guesses costly.
  - text: notification
    why: Notification responds to an incident rather than protecting stored passwords.
  answer: 2
- id: st03
  type: try
  title: Flag a risk in a fictitious config
  task: Change patched to False. The audit should report one issue.
  starter: |
    config = {"patched": True}
    issues = []
    if not config["patched"]:
        issues.append("dependency")
    print(len(issues))
  check:
    stdout_line: '1'
- id: st04
  type: read
  title: Audit the toy app's six weak points
  body: |
    Plaintext or a fast password hash leaves passwords exposed or cheap to guess.
    A key in a repository can remain in history. Move it out and revoke any leaked copy.
    Missing object checks expose reports. Broad service permissions increase the amount of data at risk.
    An unpatched dependency may have a known flaw. Track versions and install verified fixes.
    Logs can copy secrets into another system. Record selected event fields without tokens.
- id: st05
  type: predict
  title: Two places contain the same key
  code: |
    key_enabled = True
    copies = {"source file": True, "old repository copy": True}
    copies.pop("source file")
    print(key_enabled, len(copies))
  choices:
  - text: True 1
    why: A removed source file does not revoke the old key or remove earlier copies.
  - text: False 0
    why: Neither revocation nor history cleanup occurred.
  - text: False 1
    why: One copy remains, and the key still works.
  - text: True 0
    why: The older copy still holds the key.
  answer: 0
- id: st06
  type: parsons
  title: Assemble two audit checks
  task: Check both settings and print the risk count after they run.
  lines:
  - 'config = {"patched": False, "scoped": False}'
  - count = 0
  - 'if not config["patched"]:'
  - '    count += 1'
  - 'if not config["scoped"]:'
  - '    count = count + 1'
  - print(count)
  accepted_orders:
  - - 1
    - 0
    - 2
    - 3
    - 4
    - 5
    - 6
  - - 0
    - 1
    - 4
    - 5
    - 2
    - 3
    - 6
  - - 1
    - 0
