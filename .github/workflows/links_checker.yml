name: Links Checker

on:
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/links_checker.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

jobs:
  link_checker:
    name: Check links and save report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT_FILE: links-report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links in Markdown files
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          output: ${{ env.REPORT_FILE }}
          format: markdown
          fail: false
          args: >-
            --verbose
            --accept 200,204,206
            --timeout 20
            --max-concurrency 3
            --no-progress
            --exclude-path _site
            README.md
            cs-quest/**/*.md
            fde-curriculum/**/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report exit code
        run: echo "Lychee exited with ${{ steps.lychee.outputs.exit_code }}"

      - name: Save link report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: links-report
          path: ${{ env.REPORT_FILE }}
          retention-days: 14
          if-no-files-found: error
