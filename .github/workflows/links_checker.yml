name: Links Checker

on:
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/links_checker.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

jobs:
  link_checker:
    name: Check links and save report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT_FILE: links-report
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check links in Markdown files
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          output: ${{ env.REPORT_FILE }}
          format: markdown
          fail: false
          args: >-
            --verbose
            --accept 200,204,206
            --timeout 20
            --max-concurrency 3
            --no-progress
            --exclude-path _site
            README.md
            cs-quest/**/*.md
            fde-curriculum/**/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report exit code
        run: echo "Lychee exited with ${{ steps.lychee.outputs.exit_code }}"

      - name: Save link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: links-report
          path: ${{ env.REPORT_FILE }}
          retention-days: 14
          if-no-files-found: error
